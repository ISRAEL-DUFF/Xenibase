name: CI

on:
  push:
  pull_request:
  # Weekly: everything, plus the load test (spec §13).
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: xenibase
          POSTGRES_PASSWORD: xenibase
          POSTGRES_DB: xenibase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xenibase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      XENIBASE_TEST_DATABASE_URL: postgres://xenibase:xenibase@127.0.0.1:5432/xenibase?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Go lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

      - name: Go tests (including Postgres-backed)
        run: make test-go

      - name: Deploy scripts (upgrade.sh, deploy-ssh.sh, enable-services.sh)
        run: make test-deploy

      - name: Caddy's acme-dns plugin with the config enable-services.sh writes
        run: make test-acmedns

      - name: Frontend type-check and tests
        run: make test-web

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: SDK tests (TypeScript, Go, Dart)
        run: make test-sdk

      - name: Documentation site
        run: make docs-site

      - name: Upload the documentation site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: dist/docs

      - name: Generated code is up to date
        run: make check-generated

      - name: Build UI and binaries
        run: make build

      - name: Binary embeds the real UI
        run: make release-check

      # Real Postgres 18 + PgBouncer via deploy/dev/compose.yaml: create ->
      # connect through the poolers -> rotate -> delete, rollback, and the
      # tenant-isolation suite (spec §7.1, §13).
      - name: Integration and isolation suites
        env:
          # M18's move under load, at 1 GB (make test-move runs 20).
          XENIBASE_TEST_MOVE_GB: "1"
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee "$RUNNER_TEMP/integration.log"


      - name: ACME against Pebble (real HTTP-01)
        run: make test-acme

      - name: Dev environment logs on failure
        if: failure()
        run: docker compose -f deploy/dev/compose.yaml --profile test logs --no-color --tail 60

      - name: Failing tests
        if: failure()
        run: grep -E -- '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/integration.log" | head -200 || true

  # The M2–M6 done-whens (and M7's smoke tests): install the compose bundle from scratch and go
  # from a fresh install to a working database entirely through the browser
  # (Pebble standing in for Let's Encrypt), then back up, delete data,
  # restore and verify, import a Supabase-shaped project and serve its app
  # (a fake S3 and the supabase/postgres image in the bundle), and run a
  # dedicated project with point-in-time recovery, promote a hobby
  # project under a live writer with its URL unchanged and no lost commits,
  # and query, browse, and chart a project without leaving the UI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Install Playwright's Chromium
        working-directory: test/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Fresh install, backups, restore, and import, through the browser
        run: make test-e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test/e2e/test-results/

  # The M7 done-when: install from docs/install.md on a clean machine, by
  # running the guide's own commands, then reach a working database in a
  # browser.
  docs-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Install Playwright's Chromium
        working-directory: test/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Install from the docs
        run: make test-docs

  # The engineering atlas (docs/atlas/README.md). Every reference on its pages
  # must resolve, so a renamed function or a moved line fails here instead
  # of leaving a broken link. And a pull request that changes the atlas's
  # pages, partials or build must commit the rebuilt site/index.html too.
  # (CI cannot compare the committed file with a rebuild byte for byte: a
  # build records the commit and date it was made at, line counts of the
  # whole tree and excerpts of the code it quotes, so it differs after any
  # later commit.) The actions are pinned to the commits the Taskiem
  # repository's atlas job uses.
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # The atlas needs no packages; without this, setup-node looks for a
          # package manager to cache.
          package-manager-cache: false
      - name: Every atlas reference resolves
        run: node docs/atlas/atlas.mjs check
      - name: Changed pages come with the rebuilt site
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- docs/atlas/pages docs/atlas/partials docs/atlas/src docs/atlas/atlas.json docs/atlas/atlas.mjs)
          if [ -n "$changed" ] && ! git diff --quiet "origin/$BASE_REF...HEAD" -- docs/atlas/site/index.html; then exit 0; fi
          if [ -n "$changed" ]; then
            echo "::error title=Atlas not rebuilt::These atlas sources changed but docs/atlas/site/index.html did not. Run make atlas and commit it."
            echo "$changed"
            exit 1
          fi

  # upgrade.sh for real (docs/deploying.md): install the previous release with
  # the bundle, prove that a release whose migration fails is rolled back with
  # its data intact, then upgrade to this commit. Slow, so it runs weekly, on
  # demand, on tags, and on branches that touch deployment.
  upgrade:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      startsWith(github.head_ref || github.ref_name, 'feat/deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade the previous release, with a rollback in between
        run: make test-upgrade

  # Dependency audit (spec §14 M7): known vulnerabilities in Go modules and
  # the standard library actually called, and in npm packages.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vulnerabilities (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          (cd sdk/go && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm audit (web UI, e2e harness, JS SDK)
        run: |
          (cd web && npm audit --audit-level=high)
          (cd test/e2e && npm audit --audit-level=high)
          (cd sdk/js && npm audit --audit-level=high)

  # 150 shared projects with pgbench on 10 (spec §13), weekly and on demand.
  load:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: pgbench from the postgres:18 image
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/pgbench" <<'SH'
          #!/bin/sh
          exec docker run --rm --network host -e PGPASSWORD -e PGSSLMODE -v "$PWD:/w" -w /w postgres:18 pgbench "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/pgbench"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Load test
        run: make test-load

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: tmp/load-report.md
