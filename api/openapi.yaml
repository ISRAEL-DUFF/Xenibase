                $ref: "#/components/schemas/Revenue"
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/payments:
    get:
      operationId: adminListPayments
      summary: Payments received, by provider and period
      tags: [admin]
      parameters:
        - name: provider
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: adminRecordPayment
      summary: Record a manual payment (a transfer to the company's bank account, a cheque), into cash:bank
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, amount_minor, reference]
              properties:
                org_id:
                  type: string
                  format: uuid
                amount_minor:
                  type: integer
                  format: int64
                reference:
                  type: string
                note:
                  type: string
                invoice_id:
                  type: string
                  format: uuid
                topup:
                  type: boolean
                received_at:
                  type: string
                  format: date-time
                proof_key:
                  type: string
                  description: From POST /api/v1/admin/billing/documents.
      responses:
        "201":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/billing/documents:
    post:
      operationId: adminUploadBillingDocument
      summary: Store a proof of payment (PDF, PNG or JPEG, up to 10 MB) for a manual payment
      tags: [admin]
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: filename
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/payments/{payment_id}/refund:
    post:
      operationId: adminRefundPayment
      summary: Refund part of a payment from the organisation's credit balance
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/PaymentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, reason]
              properties:
                amount_minor:
                  type: integer
                  format: int64
                reason:
                  type: string
                reopen_invoices:
                  type: boolean
                  description: >-
                    When the organisation's credit doesn't cover the refund, take the rest back
                    off the invoices this payment settled, which are owed again.
      responses:
        "200":
          description: The refund (pending until the provider confirms).
          content:
            application/json:
              schema:
                type: object
                required: [id, status, amount_minor]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  amount_minor:
                    type: integer
                    format: int64
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/payment-events:
    get:
      operationId: adminListPaymentEvents
      summary: Provider events as received, newest first
      tags: [admin]
      parameters:
        - name: outcome
          in: query
          schema:
            type: string
            enum: [posted, duplicate, unmatched, rejected, failed, ignored]
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/payment-events/{event_id}/attribute:
    post:
      operationId: adminAttributePaymentEvent
      summary: Settle an unmatched transfer for an organisation (it is verified again first)
      tags: [admin]
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/wht:
    get:
      operationId: adminOutstandingWht
      summary: Deducted WHT awaiting its credit note, oldest first (format=csv exports all WHT receivable for tax filing)
      tags: [admin]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Outstanding WHT.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutstandingWht"
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/invoices/{invoice_id}/wht-certificate:
    post:
      operationId: adminUploadWhtCertificate
      summary: Attach a WHT credit note to an invoice
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/InvoiceID"
        - name: filename
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored; the WHT is evidenced.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/reconciliation:
    get:
      operationId: adminLastReconciliation
      summary: The latest reconciliation against each provider
      tags: [admin]
      responses:
        "200":
          description: Per provider.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reconciliation"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: adminRunReconciliation
      summary: Reconcile a period now (default the previous day)
      tags: [admin]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Per provider.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reconciliation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/orgs/{org}/billing/grace:
    put:
      operationId: adminSetGrace
      summary: Hold dunning for an organisation until a date (null ends the extension)
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "204":
          description: Set.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance/announcements:
    get:
      operationId: listMaintenanceAnnouncements
      summary: Announced maintenance windows not yet over, and the last month's (V3.1 §4)
      tags: [admin]
      responses:
        "200":
          description: Announcements, newest window first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAnnouncementList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: announceMaintenance
      summary: Announce a maintenance window (status page, emails); announced 72 hours ahead, it is excluded from the SLA
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceAnnouncementRequest"
      responses:
        "201":
          description: Announced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAnnouncement"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance/announcements/preview:
    post:
      operationId: previewMaintenanceAnnouncement
      summary: The email an announcement would send, and how many it reaches
      description: >-
        Rendered from the template the announcement uses (V4.1 §8.3): for a
        draft (incident_id), the email confirming it sends; otherwise the
        email announcing the given window and scope would send.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenancePreviewRequest"
      responses:
        "200":
          description: The email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenancePreview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance/announcements/{incident_id}/confirm:
    post:
      operationId: confirmMaintenanceDraft
      summary: Announce a maintenance draft Xenibase proposed
      description: Its notice counts from now; it goes to the status page and the owners and admins it covers are emailed (V4.1 §8.2).
      tags: [admin]
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Announced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAnnouncement"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance/announcements/{incident_id}/discard:
    post:
      operationId: discardMaintenanceDraft
      summary: Discard a maintenance draft; the work it was for keeps waiting
      tags: [admin]
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAnnouncement"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance/announcements/{incident_id}:
    delete:
      operationId: cancelMaintenance
      summary: Cancel an announced maintenance window
      tags: [admin]
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceAnnouncement"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance:
    get:
      operationId: getMaintenance
      summary: The maintenance window, instances behind their image's Postgres release, and recent minor upgrades
      tags: [admin]
      responses:
        "200":
          description: Maintenance state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/maintenance/window:
    put:
      operationId: putMaintenanceWindow
      summary: Change the weekly maintenance window (UTC)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceWindow"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceWindow"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/instances/{instance_id}/minor-upgrade:
    post:
      operationId: minorUpgradeInstance
      summary: Restart an instance onto its image's newer Postgres minor release now, outside the window
      tags: [admin]
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The upgrade ran; error is set if it failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinorUpgrade"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/failure-domains:
    get:
      operationId: listFailureDomainProblems
      summary: HA pairs, etcd members and pooler pairs that share a failure domain (V3.1 §2.4)
      tags: [admin]
      responses:
        "200":
          description: The groups that break the rule; empty when none do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureDomainProblems"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/etcd:
    get:
      operationId: getEtcdCluster
      summary: A region's etcd cluster HA instances keep their state in, and each member's health (V3.1 §3.1)
      tags: [admin]
      parameters:
        - name: region
          in: query
          required: false
          description: The region (default the home region).
          schema:
            type: string
      responses:
        "200":
          description: The cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EtcdCluster"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: setupEtcdCluster
      summary: Set up a region's etcd cluster, one member on each of three of its nodes in three failure domains
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtcdSetupRequest"
      responses:
        "202":
          description: The setup operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/etcd/members/{node_id}/replace:
    post:
      operationId: replaceEtcdMember
      summary: Replace the etcd member on a node (dead or alive) with one on another node in its region (V3.1 §3.2)
      description: The other members must be healthy. The cluster keeps its quorum throughout.
      tags: [admin]
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EtcdReplaceRequest"
      responses:
        "202":
          description: The replacement operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/shared-clusters:
    get:
      operationId: listSharedClusters
      summary: Shared clusters and the organisation each is reserved for (platform admin)
      tags: [admin]
      responses:
        "200":
          description: Clusters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedClusterList"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An API token (`xb_…`, from Account → API tokens, `xenibase login` or
        `POST /api/v1/tokens`) as `Authorization: Bearer <token>`. Token
        calls need no CSRF header and carry the token's scopes (`read`,
        `write`, …) and project restriction; routes that a token can't
        reach answer 403 `token_not_allowed` or `insufficient_scope`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: xenibase_session
      description: |
        The dashboard's session cookie (the browser flow). Mutating calls
        also need the `X-CSRF-Token` header from `GET /api/v1/session`.
  parameters:
    InsightRange:
      name: range
      in: query
      schema:
        type: string
        enum: ["1h", "24h", "7d", "30d"]
    InsightQueryID:
      name: query_id
      in: path
      required: true
      schema:
        type: string
    SavedQueryID:
      name: query_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SchemaName:
      name: schema
      in: path
      required: true
      schema:
        type: string
    TableName:
      name: table
      in: path
      required: true
      schema:
        type: string
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetID:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AcceptUnrestorable:
      name: accept_unrestorable
      in: query
      description: Delete even though the target holds unexpired backups, which become unrestorable.
      schema:
        type: boolean
        default: false
    TokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestID:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgID:
      name: org
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceID:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PriceBookVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
    UserID:
      name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgQuery:
      name: org
      in: query
      description: The organisation to list; your personal organisation when omitted.
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      description: Action prefix, e.g. `project.` or `auth.login`.
      schema:
        type: string
    AuditOutcome:
      name: outcome
      in: query
      schema:
        type: string
        enum: [success, failure, denied]
    AuditTarget:
      name: target_id
      in: query
      schema:
        type: string
    AuditBefore:
      name: before
      in: query
      description: Return entries with an id below this (pagination).
      schema:
        type: integer
        format: int64
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    MetricRange:
      name: range
      in: query
      schema:
        type: string
        enum: [1h, 24h, 7d]
        default: 24h
    MetricNames:
      name: metric
      in: query
      description: Metrics to return; all when omitted.
      schema:
        type: array
        items:
          type: string
    BackupID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReplicaID:
      name: replica_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BucketID:
      name: bucket
      in: path
      required: true
      schema:
        type: string
    ObjectPath:
      name: path
      in: query
      required: true
      description: The file's path in the bucket
      schema:
        type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OAuthError:
      description: An OAuth 2.0 error (RFC 6749 s5.2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Version:
      type: object
      required: [version, commit, build_date, go_version]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 15506e9
        build_date:
          type: string
          example: "2026-10-01T00:00:00Z"
        go_version:
          type: string
          example: go1.25.0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginChallenge:
      description: >-
        A correct password. Accounts with two-factor sign-in (and platform staff)
        get a challenge to complete with `/auth/totp`; an account without it is
        signed in right away and gets the session instead.
      type: object
      properties:
        challenge_id:
          type: string
        enrollment:
          $ref: "#/components/schemas/LoginEnrollment"
        session:
          $ref: "#/components/schemas/SessionState"
    LoginEnrollment:
      description: First sign-in - enrol this authenticator; the next code completes it.
      type: object
      required: [totp_secret, totp_uri, expires_at]
      properties:
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    TotpRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
        code:
          type: string
    ReauthRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
          description: Required when two-factor sign-in is on for the account.
    TotpStatus:
      type: object
      required: [enabled, required]
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
          description: Platform staff must keep two-factor sign-in on.
    TotpSetupRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    TotpSetup:
      type: object
      required: [setup_token, totp_secret, totp_uri, expires_at]
      properties:
        setup_token:
          type: string
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    TotpEnableRequest:
      type: object
      required: [setup_token, code]
      properties:
        setup_token:
          type: string
        code:
          type: string
    TotpDisableRequest:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
          description: A code from the authenticator, or a recovery code.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_implemented
        message:
          type: string
        quota:
          $ref: "#/components/schemas/QuotaItem"
        sql_error:
          $ref: "#/components/schemas/SqlError"
        statement:
          type: string
          description: The DDL statement Postgres refused.
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    OperationLogEntry:
      type: object
      required: [ts, step, level, msg]
      properties:
        ts:
          type: string
          format: date-time
        step:
          type: string
        level:
          type: string
          enum: [info, warn, error]
        msg:
          type: string
    RegionOverview:
      type: object
      required: [region, pooler_hosts, etcd_members, etcd_ready, ha_elsewhere]
      properties:
        region:
          type: string
        pooler_hosts:
          type: array
          items:
            $ref: "#/components/schemas/RegionPoolerHost"
        pooler_pair_problem:
          type: string
          nullable: true
          description: Set when the pair shares a failure domain (or one isn't set).
        etcd_members:
          type: array
          items:
            $ref: "#/components/schemas/RegionEtcdMember"
        etcd_ready:
          type: boolean
        etcd_problem:
          type: string
          nullable: true
          description: Why the region's cluster can't take projects yet, when it can't.
        ha_elsewhere:
          type: array
          description: The region's HA projects whose Patroni state is in another region's etcd cluster.
          items:
            $ref: "#/components/schemas/RegionHAElsewhere"
        move_all:
          $ref: "#/components/schemas/Operation"
    RegionPoolerHost:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        failure_domain:
          type: string
          nullable: true
    RegionEtcdMember:
      type: object
      required: [node_id, node_name, status]
      properties:
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        status:
          type: string
        failure_domain:
          type: string
          nullable: true
    RegionHAElsewhere:
      type: object
      required: [project_id, name, etcd_region]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        etcd_region:
          type: string
    Operation:
      type: object
      required: [id, kind, params, status, attempts, run_after, log, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: create
        project_id:
          type: string
          format: uuid
          nullable: true
        params:
          type: object
          additionalProperties: true
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        run_after:
          type: string
          format: date-time
        log:
          type: array
          items:
            $ref: "#/components/schemas/OperationLogEntry"
        error:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"
    OperationStatusEvent:
      type: object
      required: [status, attempts]
      properties:
        status:
          $ref: "#/components/schemas/OperationStatus"
        attempts:
          type: integer
        error:
          type: string
          nullable: true
    NoopParams:
      type: object
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
        delay_ms:
          type: integer
          minimum: 0
          maximum: 10000
          default: 500
        fail_attempts:
          type: integer
          minimum: 0
          default: 0
          description: Fail the first N attempts to exercise retries.
    ProjectStatus:
      type: string
      enum: [provisioning, active, promoting, demoting, moving, upgrading, restoring, deleting, error]
    ProjectTier:
      type: string
      enum: [shared, dedicated]
    ConnectionInfo:
      type: object
      required: [host, session_port, pooled_port, database, user, sslmode, pooled_url, session_url]
      properties:
        host:
          type: string
          example: db.example.com
        session_port:
          type: integer
          example: 5432
        pooled_port:
          type: integer
          example: 6543
        database:
          type: string
          example: blog_k2f9
        user:
          type: string
          example: blog_k2f9_owner
        sslmode:
          type: string
          example: require
        pooled_url:
          type: string
          description: Transaction-mode URL (app traffic). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:6543/blog_k2f9?sslmode=require
        session_url:
          type: string
          description: Session-mode URL (migrations). Without a password unless returned at creation or rotation.
          example: postgresql://blog_k2f9_owner@db.example.com:5432/blog_k2f9?sslmode=require
    Project:
      type: object
      required: [id, org_id, name, slug, db_name, owner_role, tier, status, settings, created_at, connection]
      properties:
        region:
          type: string
          description: The region the project runs in (V3 §6).
        data_residency:
          type: boolean
          description: Data, backups and branches stay in the project's region's country (V3 §6.3).
        forward_region:
          type: string
          nullable: true
          description: After a region move, the old region still routing the old hostname.
        forward_until:
          type: string
          format: date-time
          nullable: true
        lifecycle:
          type: string
          enum: [active, paused, archived]
          description: A Free project paused or archived for inactivity (V3 §4).
        last_active_at:
          type: string
          format: date-time
          nullable: true
          description: The last time a client was seen through the poolers.
        paused_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        parent_project_id:
          type: string
          format: uuid
          nullable: true
          description: Set for a branch (V2 §8).
        branch:
          $ref: "#/components/schemas/BranchInfo"
        sensitive_data:
          type: boolean
        branch_count:
          type: integer
          description: Live branches of this project.
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        my_role:
          $ref: "#/components/schemas/ProjectRole"
        storage_state:
          $ref: "#/components/schemas/StorageState"
        can_switch_credentials:
          type: boolean
          description: A V1 project that still uses its V1 owner role (V2 §10.2).
        legacy_credentials_until:
          type: string
          format: date-time
          nullable: true
          description: The V1 credentials stop working at this time.
        name:
          type: string
        slug:
          type: string
        db_name:
          type: string
        owner_role:
          type: string
        tier:
          $ref: "#/components/schemas/ProjectTier"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: string
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettings"
        created_at:
          type: string
          format: date-time
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
        last_backup_at:
          type: string
          format: date-time
          nullable: true
          description: When the latest backup of this project finished.
        instance:
          $ref: "#/components/schemas/InstanceSummary"
        pitr_window:
          $ref: "#/components/schemas/PitrWindow"
        retired_copy_until:
          type: string
          format: date-time
          nullable: true
          description: |
            After a promotion, when the read-only shared copy is dropped;
            after a demotion, when the stopped dedicated instance is
            destroyed (and the dedicated allowance released).
    ProjectSettings:
      type: object
      required: [connection_limit, pool_size, statement_timeout, idle_in_transaction_session_timeout, disk_warn_bytes, console_read_only]
      properties:
        connection_limit:
          type: integer
        pool_size:
          type: integer
        statement_timeout:
          type: string
        idle_in_transaction_session_timeout:
          type: string
        disk_warn_bytes:
          type: integer
          format: int64
        console_read_only:
          type: boolean
        backup_retention:
          $ref: "#/components/schemas/BackupRetention"
    BackupRetention:
      type: string
      enum: [standard, extended, long]
      description: |
        How long nightly backups are kept: standard (7 daily, 4 weekly),
        extended (30 daily, 12 weekly) or long (30 daily, 52 weekly). The
        longer two are billed add-ons on Pro and Team (V4.1 §4.2).
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Region:
      type: object
      required: [id, name, country, residency, home]
      properties:
        id:
          type: string
          example: ng-lagos
        name:
          type: string
          example: Lagos
        country:
          type: string
          description: ISO 3166 two-letter code; empty when not tied to one.
        residency:
          type: boolean
          description: Projects here may turn data residency on.
        home:
          type: boolean
          description: The platform's home region, where projects go by default.
    RegionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Region"
    AdminRegion:
      type: object
      required: [id, name, country, pooler_host, provider, location, residency, status, home, nodes, pooler_hosts, projects, residency_projects, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
        pooler_host:
          type: string
          description: The hostname in the region's connection strings; empty is the platform's database host.
        provider:
          type: string
          description: manual or hetzner.
        location:
          type: string
          description: The provider's location for new servers (e.g. nbg1); empty for manual.
        storage_target_id:
          type: string
          format: uuid
          nullable: true
          description: Where the region's projects back up (platform default when null).
        copy_target_id:
          type: string
          format: uuid
          nullable: true
          description: Where backups on platform targets are copied (V3 §2.5).
        floating_ip_id:
          type: string
          nullable: true
          description: The region's pooler floating IP at the provider.
        residency:
          type: boolean
        status:
          type: string
          enum: [active, hidden]
        home:
          type: boolean
        nodes:
          type: integer
        pooler_hosts:
          type: integer
          description: The region's own pooler hosts; with none, the home region's poolers serve its projects.
        projects:
          type: integer
        residency_projects:
          type: integer
        created_at:
          type: string
          format: date-time
    AdminRegionList:
      type: object
      required: [items, copies]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRegion"
        copies:
          type: array
          description: Cross-region copy status of the last 7 days' backups.
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
                enum: [none, pending, copied, failed, skipped]
              count:
                type: integer
    RegionReadiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
          description: No blocking check fails, so the region can be opened.
        checks:
          type: array
          items:
            $ref: "#/components/schemas/RegionCheck"
    RegionCheck:
      type: object
      required: [name, ok, blocking, detail]
      properties:
        name:
          type: string
        ok:
          type: boolean
        blocking:
          type: boolean
          description: Failing, and keeps a hidden region hidden.
        detail:
          type: string
    AdminRegionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        country:
          type: string
        pooler_host:
          type: string
        provider:
          type: string
          description: manual (the default) or hetzner.
        location:
          type: string
        storage_target_id:
          type: string
          format: uuid
          nullable: true
        copy_target_id:
          type: string
          format: uuid
          nullable: true
        floating_ip_id:
          type: string
          nullable: true
        residency:
          type: boolean
        hidden:
          type: boolean
          description: Hidden regions take no new projects.
    ProjectResidencyRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ProjectResidencyResult:
      type: object
      required: [project, removed_copies]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        removed_copies:
          type: integer
          description: Cross-region copies outside the region that were deleted.
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        preview:
          type: boolean
          description: Allow a Postgres major in preview (V4.1 §6.1).
        org_id:
          type: string
          format: uuid
          description: The organisation; your personal organisation when omitted.
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: My Blog
        description:
          type: string
          maxLength: 1000
        tier:
          $ref: "#/components/schemas/ProjectTier"
        node_id:
          type: string
          format: uuid
          description: Dedicated only; default is the least loaded dedicated node.
        region:
          type: string
          description: The region (see /regions); the platform's home region by default. A branch is always in its parent's.
        data_residency:
          type: boolean
          description: Keep the data, backups and branches in the region's country; the region must offer it.
        profile:
          type: string
          description: Dedicated only (see /profiles); default small.
        volume_gb:
          type: integer
          minimum: 1
          maximum: 16384
          description: Dedicated only; default 20.
        pg_version:
          type: integer
          description: Postgres major version (see /profiles); default the newest.
    ProjectCredentials:
      type: object
      description: Shown once. Xenibase keeps only the SCRAM verifier.
      required: [project, operation, password, connection]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        operation:
          $ref: "#/components/schemas/Operation"
        password:
          type: string
        connection:
          $ref: "#/components/schemas/ConnectionInfo"
        api:
          $ref: "#/components/schemas/BranchApi"
    BranchApi:
      type: object
      description: >-
        A branch's own backend services API (V4.1 §9.5), when its parent has
        them: a new ref and keys, shown once. The parent's keys and tokens
        don't work on it.
      required: [ref, publishable_key, secret_key]
      properties:
        ref:
          type: string
        url:
          type: string
          nullable: true
        publishable_key:
          type: string
        secret_key:
          type: string
    SessionState:
      type: object
      required: [authenticated, setup_required, csrf_token]
      properties:
        authenticated:
          type: boolean
        setup_required:
          type: boolean
        csrf_token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        signup_mode:
          type: string
          enum: [invite_only, approval, open]
        turnstile_site_key:
          type: string
          description: Signing up needs a solved Cloudflare Turnstile challenge with this site key.
        terms_required:
          type: integer
          nullable: true
          description: A terms version the user must accept before anything else.
        recovery_codes:
          type: array
          description: Set once, when this sign-in enrolled the authenticator.
          items:
            type: string
        reauth_until:
          type: string
          format: date-time
          nullable: true
          description: Destructive actions are allowed without re-authenticating until then.
        idle_timeout_seconds:
          type: integer
    SetupBeginRequest:
      type: object
      required: [setup_code, email, password]
      properties:
        setup_code:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    SetupEnrollment:
      type: object
      required: [enrollment_token, totp_secret, totp_uri, expires_at]
      properties:
        enrollment_token:
          type: string
        totp_secret:
          type: string
        totp_uri:
          type: string
        expires_at:
          type: string
          format: date-time
    SetupCompleteRequest:
      type: object
      required: [enrollment_token, code]
      properties:
        enrollment_token:
          type: string
        code:
          type: string
    AuditEntry:
      type: object
      required: [id, action, outcome, detail, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
          nullable: true
        user_email:
          type: string
          nullable: true
        actor_kind:
          type: string
          enum: [session, token, system]
        org_id:
          type: string
          format: uuid
          nullable: true
        project_id:
          type: string
          format: uuid
          nullable: true
        break_glass:
          type: boolean
        action:
          type: string
          example: project.create
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [success, failure, denied]
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_before:
          type: integer
          format: int64
          nullable: true
    DbHostRequest:
      type: object
      required: [db_host]
      properties:
        db_host:
          type: string
          example: db.example.com
    DnsCheck:
      type: object
      required: [host, addresses, server_addresses, points_here]
      properties:
        host:
          type: string
        addresses:
          type: array
          items:
            type: string
        server_addresses:
          type: array
          items:
            type: string
          description: Addresses this server considers its own.
        points_here:
          type: boolean
        error:
          type: string
          nullable: true
    TlsStatus:
      type: object
      required: [mode, state]
      properties:
        mode:
          type: string
          enum: [acme, self-signed, files, off]
        state:
          type: string
          enum: [ok, pending, error, off]
        host:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
        not_after:
          type: string
          format: date-time
          nullable: true
        error:
          type: string
          nullable: true
    GeneralSettings:
      type: object
      required: [db_host, session_port, pooled_port, sslmode, tls]
      properties:
        db_host:
          type: string
        session_port:
          type: integer
        pooled_port:
          type: integer
        sslmode:
          type: string
        tls:
          $ref: "#/components/schemas/TlsStatus"
    BranchInfo:
      type: object
      required: [source, schema_only, backups]
      properties:
        source:
          type: string
          enum: [backup, live]
        schema_only:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the branch deletes itself; null keeps it.
        backups:
          type: boolean
          description: Whether it takes nightly backups.
    BranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        source:
          type: string
          enum: [backup, live]
          default: backup
        schema_only:
          type: boolean
          description: Defaults to whether the parent contains sensitive data.
        ttl_hours:
          type: integer
          minimum: 0
          maximum: 720
          description: Hours until the branch deletes itself (1 to 720; 0 keeps it). Default 168.
        copy_files:
          type: boolean
          description: >-
            With backend services: copy the parent's stored files into the
            branch, in the background (counted against the organisation's file
            storage). Without it, the copied file records have no bytes.
    BranchResetRequest:
      type: object
      properties:
        source:
          type: string
          enum: [backup, live]
          description: Defaults to the source the branch was created from.
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 1000
          nullable: true
        settings:
          $ref: "#/components/schemas/ProjectSettingsPatch"
        sensitive_data:
          type: boolean
          description: The project contains sensitive data; its branches default to schema only (project admins).
        expires_at:
          type: string
          format: date-time
          description: Branches only. When the branch deletes itself, within 30 days.
        no_expiry:
          type: boolean
          description: Branches only. Keep the branch until deleted.
        branch_backups:
          type: boolean
          description: Branches only. Take nightly backups (off by default).
    ProjectSettingsPatch:
      type: object
      properties:
        connection_limit:
          type: integer
          minimum: 1
          maximum: 1000
        pool_size:
          type: integer
          minimum: 1
          maximum: 1000
        statement_timeout:
          type: string
          description: Postgres duration such as `60s`; empty to unset.
        idle_in_transaction_session_timeout:
          type: string
        disk_warn_bytes:
          type: integer
          format: int64
          minimum: 0
        console_read_only:
          type: boolean
        backup_retention:
          $ref: "#/components/schemas/BackupRetention"
    ProjectUpdated:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        operation:
          $ref: "#/components/schemas/Operation"
    BackupKind:
      type: string
      enum: [logical, base, final, safety, metadata, archive]
    Backup:
      type: object
      required: [id, kind, status, started_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        project_name:
          type: string
          nullable: true
        project_deleted:
          type: boolean
        kind:
          $ref: "#/components/schemas/BackupKind"
        status:
          type: string
          enum: [running, succeeded, failed, copied]
          description: "`copied`: copied to another target (the copy is its own backup); the original is kept until deleted."
        storage_target:
          type: string
          nullable: true
          description: The target's name ("an org target" where its name isn't the viewer's to see).
        storage_kind:
          $ref: "#/components/schemas/StorageTargetKind"
        encryption:
          type: string
          enum: [instance, project]
          description: "`project`: an OpenPGP message to the project's own key (opens with gpg)."
        key_fingerprint:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        checksum:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        operation_id:
          type: string
          format: uuid
          nullable: true
        error:
          type: string
          nullable: true
    BackupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
    BackupOverview:
      type: object
      required: [storage_configured, key, agent_available, window_hour_utc, retention_daily, retention_weekly]
      properties:
        storage_configured:
          type: boolean
        key:
          $ref: "#/components/schemas/BackupKeyInfo"
        agent_available:
          type: boolean
        window_hour_utc:
          type: integer
        retention_daily:
          type: integer
        retention_weekly:
          type: integer
        last_restore_test:
          $ref: "#/components/schemas/Operation"
        last_metadata_backup:
          $ref: "#/components/schemas/Backup"
    RestoreRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [new, in_place]
          default: new
        name:
          type: string
          description: Name of the new project (mode `new`).
          maxLength: 64
        confirm:
          type: string
          description: The project's name, typed (mode `in_place`).
