        platform:
          type: boolean
          description: One of Xenibase's own sessions.
    LockBlock:
      type: object
      required: [blocked, lock, blockers]
      properties:
        blocked:
          $ref: "#/components/schemas/DBSession"
        lock:
          type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/DBSession"
    LockList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LockBlock"
    ReclaimSpaceRequest:
      type: object
      required: [schema, table]
      properties:
        schema:
          type: string
        table:
          type: string
    ReapedSession:
      type: object
      required: [kind, role, duration_s, created_at]
      properties:
        kind:
          type: string
          enum: [statement, idle_in_transaction]
        role:
          type: string
        duration_s:
          type: integer
        query:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    ReapedSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReapedSession"
    AdminOrgSummary:
      type: object
      required: [id, name, slug, plan, status, personal, member_count, project_count, size_bytes, outbound_disabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        status:
          type: string
          enum: [active, suspended, deleting, deleted]
        suspended_reason:
          type: string
          nullable: true
        personal:
          type: boolean
        member_count:
          type: integer
        project_count:
          type: integer
        size_bytes:
          type: integer
          format: int64
        org_target_projects:
          type: integer
          description: Live projects whose backups go to one of the organisation's own targets (which the platform admin doesn't see, V2 §6).
        outbound_disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    AdminOrgList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrgSummary"
    SharedCluster:
      type: object
      required: [id, node_name, project_count]
      properties:
        id:
          type: string
          format: uuid
        node_name:
          type: string
        org_id:
          type: string
          format: uuid
          nullable: true
        org_name:
          type: string
          nullable: true
        project_count:
          type: integer
    SharedClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SharedCluster"
    AdminOrg:
      type: object
      required: [org, plan_id, limits, limit_overrides, dedicated_allowance, clusters, break_glass]
      properties:
        org:
          $ref: "#/components/schemas/AdminOrgSummary"
        plan_id:
          type: string
          format: uuid
        limits:
          type: object
          description: Effective limits (plan with overrides); absent keys are unlimited.
          additionalProperties:
            type: integer
            format: int64
        limit_overrides:
          type: object
          additionalProperties:
            type: integer
            format: int64
            nullable: true
        dedicated_allowance:
          $ref: "#/components/schemas/DedicatedAllowance"
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/SharedCluster"
        break_glass:
          type: array
          description: Your open break-glass sessions on this organisation.
          items:
            $ref: "#/components/schemas/BreakGlassSession"
    AdminUpdateOrgRequest:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        limit_overrides:
          type: object
          description: Replaces the overrides. A number sets a limit; null makes it unlimited.
          additionalProperties:
            type: integer
            format: int64
            nullable: true
        dedicated_allowance:
          $ref: "#/components/schemas/DedicatedAllowance"
        outbound_disabled:
          type: boolean
    SetOrgClusterRequest:
      type: object
      required: [instance_id]
      properties:
        instance_id:
          type: string
          format: uuid
        reserved:
          type: boolean
          description: True reserves the cluster for this organisation (default); false releases it.
    Plan:
      type: object
      required: [id, name, limits, org_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        limits:
          type: object
          additionalProperties:
            type: integer
            format: int64
        org_count:
          type: integer
    PlanList:
      type: object
      required: [items, keys]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        keys:
          type: array
          description: Known limit keys, in display order.
          items:
            type: string
    PlanRequest:
      type: object
      required: [name, limits]
      properties:
        name:
          type: string
        limits:
          type: object
          additionalProperties:
            type: integer
            format: int64
