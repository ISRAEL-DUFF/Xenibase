        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateJob
      summary: Change, pause or resume a job
      description: Fields left out keep their values.
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/JobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteJob
      summary: Delete a job and its history
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/JobID"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/jobs/{job_id}/run:
