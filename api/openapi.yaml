              schema:
                $ref: "#/components/schemas/TableInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/tables/{schema}/{table}/export:
    get:
      operationId: exportTableRows
      summary: Export filtered, sorted rows as CSV or JSON (at most 100,000)
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
        - name: filter
          in: query
          description: |
            Repeatable. A JSON object `{"column", "op", "value"|"values"}`;
            op is eq, neq, lt, lte, gt, gte, contains, is_null, not_null or in.
          schema:
            type: array
            items:
              type: string
        - name: where
          in: query
          description: |
            A raw condition, as typed after WHERE (the filter bar), e.g.
            `email = 'a@b.c' or phone like '081%'`. It is checked (one
            expression, nothing that ends a WHERE clause) and runs as the
            project's read-only role in a read-only transaction. Combined
            with `filter` by AND.
          schema:
            type: string
            maxLength: 4000
        - name: sort
          in: query
          schema:
            type: string
        - name: desc
          in: query
          schema:
            type: boolean
        - name: order
          in: query
          description: |
            Repeatable, in priority order. A JSON object `{"column", "desc"}`;
            several sort by each column in turn. Takes the place of sort and
            desc.
          schema:
            type: array
            items:
              type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
      responses:
        "200":
          description: The rows; X-Xenibase-Truncated is true when there were more.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  type: object
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/tables/{schema}/{table}/count:
    get:
      operationId: countTableRows
      summary: How many rows the grid holds, filtered
      description: |
        Exact, unless the table is big and unfiltered (the planner's
        estimate) or counting takes over 5 seconds.
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
        - name: filter
          in: query
          description: Repeatable, as for the rows.
          schema:
            type: array
            items:
              type: string
        - name: where
          in: query
          description: |
            A raw condition, as typed after WHERE (the filter bar), e.g.
            `email = 'a@b.c' or phone like '081%'`. It is checked (one
            expression, nothing that ends a WHERE clause) and runs as the
            project's read-only role in a read-only transaction. Combined
            with `filter` by AND.
          schema:
            type: string
            maxLength: 4000
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowCount"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/tables/{schema}/{table}/definition:
    get:
      operationId: getTableDefinition
      summary: The table, view or materialized view as DDL
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
      responses:
        "200":
          description: The definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDefinition"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/tables/{schema}/{table}/changes:
    post:
      operationId: saveTableChanges
      summary: Save staged row edits in one transaction
      description: |
        Inserts, updates and deletes (at most 500) in one transaction with
        statement_timeout 30s and lock_timeout 5s (V2 §4.2). Updates and
        deletes match the row's `xmin` from when it was loaded: if someone
        changed or deleted it since, nothing is saved and the answer is 409
        with the row as it is now. A change Postgres refuses rolls back the
        batch: 422 with the failing change and its error.
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRowsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRowsResult"
        "409":
          description: A row changed since it was loaded; nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRowsResult"
        "422":
          description: Postgres refused a change; nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveRowsResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/schema/preview:
    post:
      operationId: previewSchemaChange
      summary: Turn a schema change into DDL, risk notes, and a reverse
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaPreviewRequest"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaPlan"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/schema/apply:
    post:
      operationId: applySchemaChange
      summary: Run a previewed schema change
      description: |
        `hash` must be the preview's: if the change would now produce other
        SQL, the answer is 409 `stale_plan`. Drops need `confirm`, the
        object's name. DDL runs with lock_timeout 5s; CREATE INDEX
        CONCURRENTLY runs outside a transaction, everything else in one.
        The SQL is written to the audit log.
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaApplyRequest"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaApplied"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/schema/migration:
    post:
      operationId: schemaMigration
      summary: Render a schema change as a migration file (plain SQL, goose, or dbmate)
      tags: [console]
      parameters:
