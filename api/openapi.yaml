        body:
          type: string
        region:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        project_ids:
          type: array
          items:
            type: string
            format: uuid
        node_ids:
          type: array
          items:
            type: string
            format: uuid
