  /api/v1/orgs/{org}/usage:
    get:
      operationId: getOrgUsage
      summary: Recorded usage (V2 §10.9), as JSON or CSV
      tags: [orgs]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: from
          in: query
