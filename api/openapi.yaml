      operationId: updateBillingContact
      summary: Turn a billing contact's status page emails on or off
      description: >-
        Paying organisations' owners and billing contacts get the status page's
        incident emails for the components and regions their projects use
        (V4.1 §7.1). Turning them off removes the contact at the next hourly
        sync.
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: email
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status_emails]
              properties:
                status_emails:
                  type: boolean
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingContact"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeBillingContact
      summary: Remove a billing contact
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/billing/invoices:
    get:
      operationId: listOrgInvoices
      summary: The organisation's issued invoices
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Invoices, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/billing/invoices/{invoice_id}:
    get:
      operationId: getOrgInvoice
      summary: An invoice with its lines and credit notes
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/InvoiceID"
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/billing/invoices/{invoice_id}/pdf:
    get:
      operationId: getOrgInvoicePdf
      summary: An invoice as PDF
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/InvoiceID"
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/billing/forecast:
    get:
      operationId: getOrgForecast
      summary: The current month so far and its forecast (V3 §3.10)
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: The forecast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingForecast"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/billing/estimate:
    post:
      operationId: estimateOrgCost
      summary: What a dedicated instance, HA, synchronous replication or an add-on would cost (shown before billable actions)
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpus:
                  type: number
                memory_mb:
                  type: integer
                  format: int64
                disk_gb:
                  type: integer
                  format: int64
                ha:
                  type: boolean
                synchronous:
                  type: boolean
                standby_only:
                  type: boolean
                  description: Price only what enabling HA adds to a running instance.
                pitr_days:
                  type: integer
                  enum: [7, 14, 30]
                  description: A dedicated instance's point-in-time recovery window (14 and 30 are add-ons).
                backup_retention:
                  $ref: "#/components/schemas/BackupRetention"
                region:
                  type: string
                  description: The region, for its premium if the price book has one.
      responses:
        "200":
          description: The estimate (before VAT).
          content:
            application/json:
              schema:
                type: object
                required: [hourly_minor, monthly_minor, lines]
                properties:
                  hourly_minor:
                    type: integer
                    format: int64
                  monthly_minor:
                    type: integer
                    format: int64
                    description: For 730 hours.
                  lines:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvoiceLine"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/billing/virtual-account:
    post:
