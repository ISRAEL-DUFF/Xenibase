  /api/v1/projects/{id}/tables/{schema}/{table}/rows:
    get:
      operationId: getTableRows
      summary: A page of a table's rows, filtered and sorted
      description: |
        50 rows per page by default (up to 1,000), keyset-paginated on the
        primary key where there is one (spec §8.6), or by offset when asked. Pass the previous page's `next` as `after`. Editable
        tables return each row's `xmin`, for the row editor's conflict
        detection (V2 §4.2).
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: schema
          in: path
          required: true
          schema:
            type: string
        - name: table
          in: path
          required: true
          schema:
            type: string
        - name: filter
          in: query
          description: |
            Repeatable. A JSON object `{"column", "op", "value"|"values"}`;
            op is eq, neq, lt, lte, gt, gte, contains, is_null, not_null or in
            (V2 §4.1). Compiled to a parameterised WHERE clause.
          schema:
            type: array
            items:
              type: string
        - name: where
          in: query
          description: |
            A raw condition, as typed after WHERE (the filter bar), e.g.
            `email = 'a@b.c' or phone like '081%'`. It is checked (one
            expression, nothing that ends a WHERE clause) and runs as the
            project's read-only role in a read-only transaction. Combined
            with `filter` by AND.
          schema:
            type: string
            maxLength: 4000
        - name: sort
          in: query
          description: A column. Sorting by the primary key pages by keyset; any other column by offset.
          schema:
            type: string
        - name: desc
          in: query
          schema:
            type: boolean
        - name: order
          in: query
          description: |
            Repeatable, in priority order. A JSON object `{"column", "desc"}`;
            several sort by each column in turn. Takes the place of sort and
            desc.
          schema:
            type: array
            items:
              type: string
        - name: after
          in: query
          schema:
            type: string
        - name: offset
          in: query
          description: Numbered pages - offset paging from this row, whatever the table's keys.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePage"
        default:
          $ref: "#/components/responses/Error"
