          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
        key_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
          nullable: true
        bytes_out:
          type: integer
          format: int64
    ApiRequestLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiRequestLog"
        next:
          type: integer
          format: int64
          description: With after, the cursor to follow from next.
    ServicesUsage:
      type: object
      required: [month, metrics]
      properties:
        month:
          type: string
          description: The month (UTC), as 2006-01.
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ServicesUsageMetric"
        charges:
          type: array
          nullable: true
          description: >-
            The month's charges so far, before VAT, that fall to the project:
            its own lines, and of an allowance's overage the share its usage
            is of the organisation's. Absent without billing, or to a caller
            who can't see the organisation's billing.
          items:
            $ref: "#/components/schemas/ServiceCharge"
    ServicesUsageMetric:
      type: object
      required: [metric, service, quantity, org_quantity]
      properties:
        metric:
          type: string
        service:
          type: string
          enum: [data_api, auth, messages, storage, realtime]
        quantity:
          type: number
          description: The project's, this month.
        org_quantity:
          type: number
          description: The organisation's, this month (allowances and limits are shared by its projects).
        included:
          type: number
          nullable: true
          description: The plan's allowance this month, above which usage is charged.
        limit:
          type: number
          nullable: true
          description: The plan's hard limit this month, at which the service stops.
    ServiceCharge:
      type: object
      required: [service, amount_minor]
      properties:
        service:
          type: string
          enum: [plan, database, data_api, auth, messages, storage, realtime, read_replicas]
        amount_minor:
          type: integer
          format: int64
    ServicesCatalog:
      type: object
      required: [schemas, tables, functions]
      properties:
        ref:
          type: string
          description: The project's API ref (its URL's host), when services are on.
        api_url:
          type: string
          nullable: true
        schemas:
          type: array
          items:
            type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTable"
        functions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogFunction"
    CatalogTable:
      type: object
      required: [schema, name, kind, rls, public, columns, primary_key, foreign_keys, referenced_by, policies, access]
      properties:
        schema:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [table, view, materialized_view, foreign_table]
        rls:
          type: boolean
        public:
          type: boolean
          description: Marked public; anyone with the publishable key reads every row.
        columns:
          type: array
          items:
            $ref: "#/components/schemas/CatalogColumn"
        primary_key:
          type: array
          items:
            type: string
        foreign_keys:
          type: array
          items:
            $ref: "#/components/schemas/CatalogForeignKey"
        referenced_by:
          type: array
          items:
            $ref: "#/components/schemas/CatalogForeignKey"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/CatalogPolicy"
        access:
          type: object
          description: The request roles' privileges (anon, user); row-level security then decides which rows.
          additionalProperties:
            $ref: "#/components/schemas/CatalogAccess"
    CatalogColumn:
      type: object
      required: [name, type, nullable, identity, generated]
      properties:
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
        default:
          type: string
        identity:
          type: boolean
        generated:
          type: boolean
        enum:
          type: array
          items:
            type: string
    CatalogForeignKey:
      type: object
      required: [name, columns, table, ref_columns, embed, multiple]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        table:
          type: string
        ref_columns:
          type: array
          items:
            type: string
        embed:
          type: string
          description: The name to embed the other side with in a select.
        multiple:
          type: boolean
    CatalogPolicy:
      type: object
      required: [name, command, permissive, roles]
      properties:
        name:
          type: string
        command:
          type: string
        permissive:
          type: boolean
        roles:
          type: array
          items:
            type: string
          description: anon, user, service, everyone, or a database role.
        using:
          type: string
        check:
          type: string
    CatalogAccess:
      type: object
      required: [select, insert, update, delete]
      properties:
        select:
          type: boolean
        insert:
          type: boolean
        update:
          type: boolean
        delete:
          type: boolean
    CatalogFunction:
      type: object
      required: [schema, name, args, returns, returns_set, volatility, security_definer]
      properties:
        schema:
          type: string
        name:
          type: string
        args:
          type: array
          items:
            type: object
            required: [name, type, optional]
            properties:
              name:
                type: string
              type:
                type: string
              optional:
                type: boolean
        returns:
          type: string
        returns_set:
          type: boolean
        volatility:
          type: string
        security_definer:
          type: boolean
    OutageMinute:
      type: object
      required: [minute]
      properties:
        minute:
          type: string
          format: date-time
        internal_ok:
          type: boolean
          nullable: true
        external_ok:
          type: boolean
          nullable: true
    HAStatus:
      type: object
      required: [enabled, synchronous, members, failovers]
      properties:
        etcd_region:
          type: string
          nullable: true
          description: The region whose etcd cluster holds the project's Patroni state.
        etcd_move_available:
          type: boolean
          description: The project's region has its own ready etcd cluster that the project doesn't use yet.
        enabled:
          type: boolean
        synchronous:
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/HAMember"
        failovers:
          type: array
          items:
            $ref: "#/components/schemas/FailoverEvent"
        availability:
          $ref: "#/components/schemas/Availability"
    InstanceUpdate:
      type: object
      properties:
        pitr_days:
          type: integer
          enum: [7, 14, 30]
        profile:
          type: string
          description: A size from GET /profiles, in place of cpus and memory_mb.
        cpus:
          type: number
          minimum: 0.25
          maximum: 64
        memory_mb:
          type: integer
          minimum: 512
          maximum: 262144
        disk_gb:
          type: integer
          maximum: 16384
          description: Up only; to shrink, move into a smaller instance.
        dry_run:
          type: boolean
          description: Only say what a resize would do (in place, or a move to which node).
    InstanceUpdated:
      type: object
      required: [instance]
      properties:
        instance:
          $ref: "#/components/schemas/InstanceSummary"
        operation:
          $ref: "#/components/schemas/Operation"
        plan:
          $ref: "#/components/schemas/ResizePlan"
    ResizePlan:
      type: object
      required: [from, to, restart]
      properties:
        from:
          $ref: "#/components/schemas/InstanceSize"
        to:
          $ref: "#/components/schemas/InstanceSize"
        restart:
          type: boolean
          description: The containers restart (a CPU or memory change); a disk change alone doesn't.
        move_to:
          type: string
          description: The node the project moves to, when its own can't hold the new size.
    InstanceSize:
      type: object
      required: [cpus, memory_mb, disk_gb]
      properties:
        cpus:
          type: number
        memory_mb:
          type: integer
        disk_gb:
          type: integer
    InstanceSummary:
      type: object
      required: [id, kind, status, node_id, node_name, pg_version]
      properties:
        pg_version:
          type: integer
          description: Postgres major version.
        ha_enabled:
          type: boolean
          description: A primary and a streaming standby on another node (V3 §2.2).
        pitr_days:
          type: integer
          description: Dedicated only. The point-in-time recovery window in days (7, 14 or 30).
        pg_version_status:
          type: string
          enum: [preview, supported, deprecated, retired]
          description: Where its Postgres major is in its life (V4.1 §6.1).
        pg_version_retires_at:
          type: string
          format: date-time
          description: When its deprecated major retires.
        pg_release:
          type: string
          nullable: true
          description: The release the instance runs ("18.1"), as its agent last reported.
        pg_release_available:
          type: string
          nullable: true
          description: The release its image now holds; a newer minor is applied in the maintenance window.
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [shared, dedicated]
        status:
          type: string
        error:
          type: string
          nullable: true
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        profile:
          type: string
          nullable: true
        cpus:
          type: number
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        volume_gb:
          type: integer
          nullable: true
    PitrWindow:
      type: object
      description: Dedicated only. Any time in [from, to] can be restored.
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    PitrRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        target_time:
          type: string
          format: date-time
          description: Omit for the latest point.
    InstanceActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart]
    InstanceState:
      type: object
      required: [state, running]
      properties:
        state:
          type: string
        running:
          type: boolean
        container:
          type: string
    Profile:
      type: object
      required: [name, cpus, memory_mb]
      properties:
        name:
          type: string
        cpus:
          type: number
        memory_mb:
          type: integer
    ProfileList:
      type: object
      required: [items, default_profile, default_volume_gb, pg_versions, default_pg_version]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        default_profile:
          type: string
        default_volume_gb:
          type: integer
        pg_versions:
          type: array
          description: Postgres majors open for new projects, oldest first (V3 §2.4); a preview needs `preview` on the create request.
          items:
            type: integer
        default_pg_version:
          type: integer
        pg_version_lifecycle:
          type: array
          description: Where each major is in its life (V4.1 §6.1).
          items:
            $ref: "#/components/schemas/PgVersionInfo"
    PgVersionInfo:
      type: object
      required: [major, status, notes, installed]
      properties:
        major:
          type: integer
        status:
          type: string
          enum: [preview, supported, deprecated, retired]
          description: A deprecated major past its retirement date is retired.
        deprecated_at:
          type: string
          format: date-time
        retires_at:
          type: string
          format: date-time
        notes:
          type: string
        installed:
          type: boolean
          description: The server has an image for it (XENIBASE_PG_VERSIONS).
        projects:
          type: integer
          description: Live projects on it (the admin list only).
    PgVersionUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [preview, supported, deprecated, retired]
        retires_at:
          type: string
          format: date-time
          description: Required to deprecate, at least 180 days ahead.
        notes:
          type: string
          maxLength: 2000
    CreateNodeRequest:
      type: object
      required: [name, private_addr, role]
      properties:
        name:
          type: string
          example: node-b
        private_addr:
          type: string
          description: The node's address on the private network (poolers and the control plane reach it here).
          example: 10.0.0.12
        role:
          type: string
          enum: [shared, dedicated, both, pooler, edge]
          description: "pooler: an edge pooler host (both PgBouncers and keepalived), never given a database. edge: runs xenibase-edge only, its cost split by backend services' use (V4.1 §11)."
        region:
          type: string
          description: The region the node is in (default the home region). A pooler host serves that region's projects.
        failure_domain:
          type: string
          description: What fails with this node (a rack, a host, a power feed), e.g. lagos-dc1-r3. Letters, digits, dots, colons, dashes and underscores.
    NodeCreated:
      type: object
      required: [node, token, expires_at, command]
      properties:
        warnings:
          type: array
          items:
            type: string
          description: E.g. a second pooler host in the same failure domain as the first.
        node:
          $ref: "#/components/schemas/Node"
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        command:
          type: string
    NodeDetail:
      type: object
      required: [node, instances]
      properties:
        node:
          $ref: "#/components/schemas/Node"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/NodeInstance"
    NodeInstance:
      type: object
      required: [id, kind, status, projects]
      properties:
        pg_version:
          type: integer
        pg_release:
          type: string
          nullable: true
          description: The release the instance runs, as its agent last reported.
        pg_release_available:
          type: string
          nullable: true
          description: The release its image now holds.
        id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
        error:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true
        cpus:
          type: number
          nullable: true
        memory_mb:
          type: integer
          nullable: true
        volume_gb:
          type: integer
          nullable: true
        address:
          type: string
        projects:
          type: integer
        created_at:
          type: string
          format: date-time
    SharedClusterRequest:
      type: object
      required: [memory_mb]
      properties:
        memory_mb:
          type: integer
          minimum: 512
        pg_version:
          type: integer
          description: Postgres major version; default the newest supported.
    UpdateNodeRequest:
      type: object
      properties:
        role:
          type: string
          enum: [shared, dedicated, both]
        failure_domain:
          type: string
          description: The node's failure domain; an empty string clears it.
    PromotionEstimate:
      type: object
      required: [size_bytes, estimated_downtime_seconds]
      properties:
        size_bytes:
          type: integer
          format: int64
        estimated_downtime_seconds:
          type: integer
          description: How long writes are expected to pause.
        copy_mode:
          type: string
          enum: [logical, dump]
          description: logical replication (writes pause for a few seconds whatever the size) or dump/restore (writes pause while it copies).
        fallback_reason:
          type: string
          description: Why logical replication can't be used.
    DemoteRequest:
      type: object
      properties:
        node_id:
          type: string
          format: uuid
          description: The node whose shared cluster takes the project (default the one with the most free capacity).
        console_writable:
          type: boolean
          description: Turn the read-only SQL console off (V2 §5.5); otherwise it keeps its current setting.
        accept_warnings:
          type: boolean
          description: Acknowledge the preflight's warnings (peak connections, settings that reset).
    UpgradeRequest:
      type: object
      required: [pg_version]
      properties:
        pg_version:
          type: integer
    UpgradeCheck:
      type: object
      required: [name, status, message]
      properties:
        name:
          type: string
          enum: [version, target, replication, schema, extensions, deprecated]
        status:
          type: string
          enum: [ok, warning, blocked]
        message:
          type: string
    UpgradePreflight:
      type: object
      required: [eligible, from, to, checks, size_bytes, estimated_downtime_seconds, copy_mode]
      properties:
        eligible:
          type: boolean
        from:
          type: integer
        to:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/UpgradeCheck"
        target_node:
          type: string
        size_bytes:
          type: integer
          format: int64
        estimated_downtime_seconds:
          type: integer
        copy_mode:
          type: string
          enum: [logical, dump]
        fallback_reason:
          type: string
    DemoteCheck:
      type: object
      required: [name, status, message]
      properties:
        name:
          type: string
          enum: [size, extensions, roles, allowance, connections, settings, capacity]
        status:
          type: string
          enum: [ok, warning, blocked]
        message:
          type: string
    DemoteTarget:
      type: object
      required: [node_id, node_name, org_cluster]
      properties:
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
        org_cluster:
          type: boolean
          description: The organisation's own shared cluster (V2 §10.5).
        free_bytes:
          type: integer
          format: int64
          nullable: true
          description: The node's free disk at its last measurement.
    DemotePreflight:
      type: object
      required: [eligible, checks, size_bytes, estimated_downtime_seconds, settings_after, resets, retain_hours]
      properties:
        eligible:
          type: boolean
          description: No check blocks the demotion (warnings still need accept_warnings).
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DemoteCheck"
        size_bytes:
          type: integer
          format: int64
        estimated_downtime_seconds:
          type: integer
          description: How long writes are expected to pause.
        copy_mode:
          type: string
          enum: [logical, dump]
          description: logical replication (writes pause for a few seconds whatever the size) or dump/restore (writes pause while it copies).
        fallback_reason:
          type: string
          description: Why logical replication can't be used.
        target:
          $ref: "#/components/schemas/DemoteTarget"
        settings_after:
          $ref: "#/components/schemas/ProjectSettings"
        resets:
          type: array
          description: The guardrails that change, e.g. "connection limit 90 → 20".
          items:
            type: string
        retain_hours:
          type: integer
          description: How long the stopped dedicated instance is kept before it is destroyed.
    WebhookRequest:
      type: object
      required: [name, tables, events, url]
      properties:
        name:
          type: string
        tables:
          type: array
          description: Tables as schema.table (or table, in public).
          items:
            type: string
        events:
          type: array
          items:
            type: string
            enum: [INSERT, UPDATE, DELETE]
        columns:
          type: array
          description: For UPDATE, fire only when one of these columns changed.
          items:
            type: string
        url:
          type: string
        headers:
          type: object
          description: Static headers sent with each request (stored encrypted, never returned).
          additionalProperties:
            type: string
        enabled:
          type: boolean
          default: true
        description:
          type: string
          maxLength: 500
          description: Free text for the webhook's owner (one line).
        metadata:
          type: object
          maxProperties: 16
          description: String tags for the webhook's owner, such as the tool that created it (keys 1 to 40 of letters, digits, dots, colons, dashes, underscores; values up to 500 characters).
          additionalProperties:
            type: string
            maxLength: 500
    WebhookUpdate:
      type: object
      properties:
        name:
          type: string
        tables:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
            enum: [INSERT, UPDATE, DELETE]
        columns:
          type: array
          nullable: true
          items:
            type: string
        url:
          type: string
        headers:
          type: object
          description: Replaces the stored headers; {} removes them.
          additionalProperties:
            type: string
        enabled:
          type: boolean
        description:
          type: string
          maxLength: 500
          description: Free text for the webhook's owner (one line).
        metadata:
          type: object
          maxProperties: 16
          description: String tags for the webhook's owner, replacing the stored ones; {} removes them (keys 1 to 40 of letters, digits, dots, colons, dashes, underscores; values up to 500 characters).
          additionalProperties:
            type: string
            maxLength: 500
    Webhook:
      type: object
      required: [id, project_id, name, description, metadata, tables, events, url, header_names, enabled, status, consecutive_failures, backlog, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        tables:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string
        url:
          type: string
        header_names:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        status:
          type: string
          enum: [healthy, failing, paused, broken]
        status_reason:
          type: string
          nullable: true
        consecutive_failures:
          type: integer
        backlog:
          type: integer
          format: int64
          description: Events waiting in the outbox.
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        previous_secret_expires_at:
          type: string
          format: date-time
          nullable: true
          description: While a rotation overlaps, until when the previous secret also signs deliveries.
        created_at:
          type: string
          format: date-time
    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
    WebhookRotateSecret:
      type: object
      properties:
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          default: 0
          description: How long the old secret keeps signing beside the new one.
    WebhookCreated:
      type: object
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: The signing secret, shown once.
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
        previous_secret_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Until when the old secret also signs, with an overlap.
    WebhookTestResult:
      type: object
      required: [event_id, ok]
      properties:
        event_id:
          type: string
        ok:
          type: boolean
        status_code:
          type: integer
        latency_ms:
          type: integer
        response:
          type: string
        error:
          type: string
    WebhookDelivery:
      type: object
      required: [id, event_id, attempt, succeeded, dead_lettered, created_at]
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: string
        attempt:
          type: integer
        status_code:
          type: integer
          nullable: true
        latency_ms:
          type: integer
          nullable: true
        response:
          type: string
          nullable: true
          description: The response body, truncated to 4 KB.
        error:
          type: string
          nullable: true
        succeeded:
          type: boolean
        dead_lettered:
          type: boolean
        replayed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
    ReplayRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
        all:
          type: boolean
    ReplayResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
    HttpJobSpec:
      type: object
      required: [url]
      properties:
        method:
          type: string
