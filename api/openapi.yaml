  /api/v1/projects/{id}/webhooks:
    get:
      operationId: listWebhooks
      summary: A project's webhooks, with their health and backlog
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The webhooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createWebhook
      summary: Send a table's changes to a URL
      description: |
        Installs triggers that write each change to an outbox in the
        project's database, in the same transaction (V2 §9.1): rolled-back
        changes never produce an event. The URL must be https:// (http://
        only to a host the platform admin allow-listed) and resolve to a
        public address. The signing secret is returned once.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/webhooks/{webhook_id}:
    get:
      operationId: getWebhook
      summary: A webhook
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: The webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateWebhook
      summary: Change, pause or resume a webhook
      description: Fields left out keep their values. Saving reinstalls the triggers, which clears a broken status.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/WebhookID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdate"
      responses:
        "200":
          description: The webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook, its triggers and its queued events
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/webhooks/{webhook_id}/test:
    post:
      operationId: testWebhook
      summary: Send a test event now
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: What the receiver answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/webhooks/{webhook_id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Replace the signing secret (returned once)
      description: |
        Without an overlap the old secret stops signing at once. With
        overlap_seconds, deliveries until then carry two v1 signatures, the
        new secret's first, so a receiver holding either one verifies.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/WebhookID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRotateSecret"
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
