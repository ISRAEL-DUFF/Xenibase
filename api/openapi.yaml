        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJob
      summary: Run SQL or call a URL on a schedule
      description: |
        SQL runs as the project owner in a transaction, with the job's
        timeout as statement_timeout; HTTP calls go through the same
        outbound rules as webhooks and are signed. The plan limits the
        number of jobs and the shortest interval (409 quota_exceeded).
        An HTTP job's signing secret is returned once.
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/jobs/{job_id}:
    get:
      operationId: getJob
