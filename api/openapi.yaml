        scheduled_start:
          type: string
          format: date-time
        scheduled_end:
          type: string
          format: date-time
        announced_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        excluded_from:
          type: string
          format: date-time
