  /api/v1/projects/{id}/services/logs:
    get:
      operationId: listAPIRequestLogs
      summary: The API's request logs (7 days), newest first; with after, newer ones oldest first
      description: >-
        With after (a log id; 0 for "from now", which answers with no logs
        and the cursor to follow from), returns the logs after it, oldest
        first, waiting up to wait seconds for one (`xenibase logs api
        --follow`). next is the cursor for the next call.
      tags: [services]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: before
          in: query
          description: A log id from the previous page.
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          description: Follow from this log id.
          schema:
            type: integer
            format: int64
        - name: wait
          in: query
          description: With after, seconds to wait for a new log (at most 25).
          schema:
            type: integer
            minimum: 0
            maximum: 25
        - name: status
          in: query
          description: A status (404) or class (5xx, 4xx).
          schema:
            type: string
            pattern: "^([1-5]xx|[1-5][0-9][0-9])$"
        - name: path
          in: query
          description: Only requests whose path starts with this.
          schema:
            type: string
            maxLength: 500
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiRequestLogList"
        default:
          $ref: "#/components/responses/Error"
