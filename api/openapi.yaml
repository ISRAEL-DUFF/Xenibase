openapi: 3.0.3
info:
  title: Xenibase API
  version: 1.0.0
  description: |
    Control-plane API for Xenibase. This file is the single source of truth:
    Go server interfaces (oapi-codegen) and TypeScript client types
    (openapi-typescript) are generated from it with `make generate`.
servers:
  - url: /
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags: [system]
      responses:
        "200":
          description: The server is ready to accept traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Build information for this server
      tags: [system]
      responses:
        "200":
          description: Version, commit, and build date of the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/v1/pricing:
    get:
      operationId: getPricing
      summary: The prices in effect, and the next price book if one is published (public)
      description: For the pricing page and the marketing site (V3 §7.4, §11). No session needed.
      tags: [billing]
      security: []
      responses:
        "200":
          description: Current prices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pricing"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Email + password login; returns a TOTP challenge
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Password accepted; complete login with /auth/totp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/totp:
    post:
      operationId: postAuthTotp
      summary: Complete login with a TOTP code
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/reauth:
    post:
      operationId: postAuthReauth
      summary: Step-up authentication for destructive actions
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "204":
          description: Step-up authentication granted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in user
      tags: [account]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Change your profile
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Session state for the UI (public)
      description: |
        Whether first-run setup is needed, who is signed in, and the CSRF
        token to send as `X-CSRF-Token` on every mutating request (also set
        as the `xenibase_csrf` cookie).
      tags: [auth]
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
  /api/v1/setup/begin:
    post:
      operationId: beginSetup
      summary: First-run setup, step 1 - owner account and TOTP enrolment
      description: |
        Only before any operator exists. `setup_code` is printed in the
        xenibase-server log. Returns the TOTP secret to enrol; nothing is
        created until `/setup/complete` proves a code.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupBeginRequest"
      responses:
        "200":
          description: TOTP enrolment details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupEnrollment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: First-run setup, step 2 - confirm TOTP and create the owner
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "200":
          description: Owner created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/general:
    get:
      operationId: getGeneralSettings
      summary: DB hostname and pooler TLS status
      tags: [settings]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/db-host:
    put:
      operationId: putDbHost
      summary: Set the hostname clients use for databases
      description: Also starts obtaining the pooler's TLS certificate for it.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbHostRequest"
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/db-host/check:
    post:
      operationId: checkDbHost
      summary: Check that a hostname resolves to this server
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DbHostRequest"
      responses:
        "200":
          description: DNS check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DnsCheck"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations:
    get:
      operationId: listOperations
      summary: List operations, newest first
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OrgQuery"
        - name: platform
          in: query
          description: Platform-level operations (no project), for the platform admin.
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OperationStatus"
        - name: kind
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Operations matching the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations/{id}:
    get:
      operationId: getOperation
      summary: Get one operation, including its step log
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationID"
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/operations/{id}/stream:
    get:
      operationId: streamOperation
      summary: Stream an operation's progress as Server-Sent Events
      description: |
        Emits `log` events (data: OperationLogEntry, id: 1-based log index),
        `status` events (data: OperationStatusEvent) whenever the status
        changes, and a final `done` event before closing once the operation
        succeeds or fails. Reconnect with `Last-Event-ID` to resume after a
        log entry.
      tags: [operations]
      parameters:
        - $ref: "#/components/parameters/OperationID"
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/dev/operations:
    post:
      operationId: createDevOperation
      summary: Enqueue a dummy operation (development only)
      description: |
        Available only when the server runs with XENIBASE_DEV_ENDPOINTS=true;
        otherwise returns 404. Enqueues a `noop` operation for exercising
        the queue end to end.
      tags: [dev]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoopParams"
      responses:
        "202":
          description: The operation was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects you can see in an organisation, newest first
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/OrgQuery"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Live projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      summary: Create a shared-tier project
      description: |
        Records the project and queues a `create` operation. The response
        carries the password and full connection URLs exactly once; Xenibase
        stores only the SCRAM verifier. The URLs work once the operation
        succeeds (stream it to follow progress).
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "202":
          description: Project recorded and create operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      summary: Project detail and connection info (no password)
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: |
        `confirm` must equal the project's name, and the session must have
        re-authenticated recently (`POST /auth/reauth`); otherwise 403 with
        code `reauth_required`. Queues a `delete` operation that takes a
        final backup (kept 30 days; `skip_final_backup` skips it), removes
        the pooler route, and drops the database and role.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: confirm
          in: query
          required: true
          schema:
            type: string
        - name: skip_final_backup
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Delete operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/settings:
    patch:
      operationId: updateProject
      summary: Update a project's name, description, or guardrails
      description: |
        Changes to guardrails that live on the backend or the pooler
        (connection limit, timeouts, pool size) queue an `apply_settings`
        operation, returned alongside the project.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/rotate-password:
    post:
      operationId: rotateProjectPassword
      summary: Rotate the project password
      description: |
        Returns the new password once and queues a `rotate` operation. The
        new password works, and the old one stops working, when it succeeds.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Rotate operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/branches:
    get:
      operationId: listBranches
      summary: The project's branches (V2 §8)
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Branches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBranch
      summary: Branch the project
      description: |
        A new shared-tier project copied from this one's latest backup
        (`source: backup`, the default) or live, schema only or with data,
        that deletes itself after `ttl_hours` (default 168; 0 keeps it).
        Returns the branch's credentials once. Webhooks and scheduled jobs
        are not copied. A project marked as containing sensitive data
        branches schema only by default, and a full copy needs the project
        admin role. 409 `quota_exceeded` past the organisation's branch or
        storage quota.
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "202":
          description: Branch creation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/reset:
    post:
      operationId: resetBranch
      summary: Reset a branch from its parent
      description: Re-creates the branch's data from the parent's latest backup or live, keeping its database name, URL, app password and members' credentials.
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchResetRequest"
      responses:
        "202":
          description: Reset queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/detach:
    post:
      operationId: detachBranch
      summary: Detach a branch into a standalone project
      description: It keeps its data and credentials, loses its parent and expiry, and counts as a project instead of a branch.
      tags: [branches]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Detached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/backups:
    post:
      operationId: createProjectBackup
      summary: Back up a project now
      description: Queues a `backup` operation (a logical backup, kept by the nightly retention policy).
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Backup operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups:
    get:
      operationId: listBackups
      summary: List backups, newest first
      description: Includes final backups of deleted projects until they expire.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/OrgQuery"
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/BackupKind"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups/overview:
    get:
      operationId: getBackupOverview
      summary: Backup configuration and health at a glance
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/OrgQuery"
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupOverview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups/{id}/download:
    get:
      operationId: downloadBackup
      summary: Download a backup as a plain pg_dump archive (organisation owners)
      description: |
        The backup decrypted: a `pg_dump` custom-format archive for
        `pg_restore` (V2 §10.10 data export). Logical, final and safety
        backups of projects only. Organisation owners only; at most two at
        a time per organisation; every download is audited.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/BackupID"
      responses:
        "200":
          description: The archive.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/backups/{id}/restore:
    post:
      operationId: restoreBackup
      summary: Restore a backup into a new project or in place
      description: |
        `mode: new` (the default, non-destructive) creates a project named
        `name` and returns its credentials once. `mode: in_place` replaces the
        backup's own project: `confirm` must equal the project's name and the
        session must have re-authenticated recently (403 `reauth_required`).
        It takes a safety backup first.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/BackupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Restore operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/restore-tests:
    post:
      operationId: runRestoreTest
      summary: Run the restore test now
      description: Restores the latest backup of a random project (or `project_id`) into a scratch database, counts every table, and drops it.
      tags: [backups]
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Restore test queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/storage:
    get:
      operationId: getStorageSettings
      summary: The backup storage target (never the secret key)
      tags: [settings]
      responses:
        "200":
          description: Storage settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putStorageSettings
      summary: Save the backup storage target after a live test
      description: Runs the write/read/list/delete test and saves only if it passes. An empty `secret_key` keeps the stored one.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageRequest"
      responses:
        "200":
          description: Test result; `saved` says whether the settings were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/storage/test:
    post:
      operationId: testStorageSettings
      summary: Run the live write/read/list/delete test without saving
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageRequest"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/backup-key:
    get:
      operationId: getBackupKey
      summary: Whether the backup key exists and was confirmed
      tags: [settings]
      responses:
        "200":
          description: Key status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: generateBackupKey
      summary: Generate the backup encryption key
      description: Returns the key for download. Refuses (409) if one exists, since replacing it would make every backup unreadable.
      tags: [settings]
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyExport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/backup-key/export:
    post:
      operationId: exportBackupKey
      summary: Download the backup key again (requires re-authentication)
      tags: [settings]
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyExport"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings/backup-key/confirm:
    post:
      operationId: confirmBackupKey
      summary: Prove the key was saved by pasting it back
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupKeyConfirmRequest"
      responses:
        "200":
          description: Key status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupKeyInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/imports/preflight:
    post:
      operationId: importPreflight
      summary: Inspect a source database before importing it
      description: Connects read-only and changes nothing. The connection string is not stored.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSource"
      responses:
        "200":
          description: What the import would copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreflight"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/imports:
    post:
      operationId: createImport
      summary: Import an existing database into a new project
      description: |
        Creates the project and queues an `import` operation. The source
        connection string is held in memory for the operation only. The
        response carries the new project's password once.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Project recorded and import queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: Nodes and their agents
      tags: [nodes]
      responses:
        "200":
          description: Nodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createNode
      summary: Add a node; returns its one-time agent registration token
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "201":
          description: The node and its token (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/pitr:
    post:
      operationId: restoreProjectPITR
      summary: Point-in-time recovery of a dedicated project into a new one
      description: |
        Restores the newest base backup taken before `target_time` (default:
        now) and replays archived WAL up to it, into a new dedicated project
        on the same node with the same size. The response carries the new
        project's password once. The source is not changed.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PitrRequest"
      responses:
        "202":
          description: Restore operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/promote:
    get:
      operationId: getPromotionEstimate
      summary: Size and estimated write freeze of promoting this shared project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionEstimate"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: promoteProject
      summary: Promote a shared project to a dedicated instance
      description: |
        Queues a `promote` operation (spec §6.6): a dedicated instance with
        the same role and password, a short write freeze while the data is
        copied and verified, then the pooler route moves. Connection strings
        do not change. If anything fails before the route moves, the project
        stays on the shared tier untouched. The shared copy is kept
        read-only for 48 hours, then dropped.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteRequest"
      responses:
        "201":
          description: Beyond the organisation's dedicated allowance, the promotion became a request for the platform admin (V2 §10.6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DedicatedRequest"
        "202":
          description: Promotion queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects/{project_id}/move:
    post:
      operationId: moveProject
      summary: Move a project to another node (platform admin, V3 §2.3)
      description: |
        Queues a `logical_move` operation. A shared project goes to the
        shared cluster on the node (same Postgres version); a dedicated
        project gets a new instance of the same size there. The data is
        copied by logical replication while the project keeps serving, then
        writes pause for a few seconds while the route switches. When
        logical replication isn't possible (see the operation log) the copy
        is a dump/restore during the pause instead. Connection strings don't
        change; the old copy is kept for 48 hours.
      tags: [projects]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveProjectRequest"
      responses:
        "202":
          description: Move queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/projects/{project_id}/roles:
    post:
      operationId: createIntegratorRoles
      summary: Create integrator roles on a dedicated project's instance (platform admin)
      description: |
        Creates the named NOLOGIN roles (NOSUPERUSER NOCREATEDB NOCREATEROLE
        NOREPLICATION NOBYPASSRLS) as the instance's superuser and grants
        each to the project's owner role WITH ADMIN OPTION, so the owner
        can grant and manage them, for integrators whose migrations expect
        them (Taskiem's `taskiem_app` and `taskiem_dispatch`). Recorded on
        the project, so moves recreate them and the demotion check names
        them. Dedicated projects only (`409 conflict` otherwise). Needs a
        recent re-authentication.
      tags: [projects]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegratorRolesRequest"
      responses:
        "200":
          description: The project's integrator roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegratorRoles"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/moves:
    get:
      operationId: listProjectMoves
      summary: The project's recent moves between instances, newest first
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Moves.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/upgrade/preflight:
    post:
      operationId: upgradePreflight
      summary: Check a major Postgres upgrade of this project (V3 §2.4)
      description: |
        Runs the upgrade's checks without changing anything: the target
        version, where the project would go, whether logical replication
        can be used, and, for a shared project, a trial restore of the
        schema on the new version that lists anything incompatible.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradePreflight"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/ha:
    get:
      operationId: getProjectHA
      summary: HA state of a dedicated project (V3 §2.2)
      description: Each member's node, role, state and lag; the failover history; the month's availability.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: HA state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: enableProjectHA
      summary: Turn HA on
      description: |
        Queues an `ha_enable` operation: the instance restarts under Patroni
        (writes pause for a few seconds), then a standby on another node is
        built from the newest base backup and streams.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HAEnableRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProjectHA
      summary: Change HA settings (synchronous replication)
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HAUpdateRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HAStatus"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: disableProjectHA
      summary: Turn HA off (the standby is removed)
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/resume:
    post:
      operationId: resumeProject
      summary: Resume a paused or archived Free project
      description: |
        Queues `resume_project` for a paused project (seconds) or
        `unarchive_project` for an archived one, which restores it from its
        archive backup (minutes). The first client connection does the same
        by itself (V3 §4.2).
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/ha/etcd-move:
    post:
      operationId: moveProjectEtcd
      summary: Move an HA project's Patroni state onto its region's own etcd cluster (V3.1 §3.3)
      description: The standby is removed, the primary restarts on the new cluster with the poolers holding clients, and a new standby is built.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/migrate/supabase:
    post:
      operationId: migrateSupabase
      summary: Run a step of the Supabase migration helper (V4 §9)
      description: |
        For a project with backend services on, after its database was
        imported from Supabase. `policies` rewrites the imported policies
        and column defaults to the project's request roles and xb_auth
        helpers; `users` copies auth.users and auth.identities from the
        Supabase database, keeping ids and bcrypt password hashes (upgraded
        to argon2id at each user's next sign-in); `storage` copies buckets,
        files (over Supabase's S3 protocol) and storage policies. Each step
        reports what it couldn't carry over in the operation's log, and can
        run again (what's already there is kept). Credentials stay in the
        server's memory only.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupabaseMigrationRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/replicas:
    get:
      operationId: listProjectReplicas
      summary: Read replicas of a dedicated project (V4 §7)
      description: Each replica's node, region, status, lag and whether the read-only route sends reads to it.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The replicas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicaList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProjectReplica
      summary: Add a read replica
      description: |
        Queues a `create_replica` operation: a streaming standby, tagged never
        to be promoted, on another node (in the project's region unless
        another is named; a project with data residency stays in its
        region). A project not yet under Patroni restarts under it first
        (writes pause for a few seconds). Up to 2 per project.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplicaCreateRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/replicas/{replica_id}:
    delete:
      operationId: deleteProjectReplica
      summary: Remove a read replica
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ReplicaID"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/replicas/{replica_id}/detach:
    post:
      operationId: detachProjectReplica
      summary: Promote a read replica into a standalone project
      description: |
        The replica leaves the project's cluster, is promoted on its own data
        and becomes a new dedicated project (its database, owner and password
        are the new project's). The response carries the new project's
        password once. The source project is not changed.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/ReplicaID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplicaDetachRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCredentials"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/switchover:
    post:
      operationId: switchoverProject
      summary: Planned switchover to a standby
      description: Writes pause for a few seconds; nothing committed is lost; the URL is unchanged.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchoverRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/upgrade:
    post:
      operationId: upgradeProject
      summary: Upgrade the project to a newer Postgres major
      description: |
        Queues a `major_upgrade` operation: the data moves to an instance of
        the new version (a shared cluster of that version, or a new
        dedicated instance) by logical replication, then writes pause for a
        few seconds while the route switches. Connection strings don't
        change. Refused with the failing checks when the preflight blocks
        it. The old copy is kept for 48 hours.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "202":
          description: Upgrade queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/demote/preflight:
    post:
      operationId: demotePreflight
      summary: Check whether this dedicated project can move back to the shared tier
      description: |
        Runs the demotion eligibility checks (V2 §5.2) without changing
        anything: size against the organisation's shared storage limits,
        extensions on the shared allow-list, no custom roles, the
        dedicated allowance released, peak connections, settings the
        shared tier resets, and a shared cluster with room (the
        organisation's own when it has one). The same checks run again
        when the demotion starts.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoteRequest"
      responses:
        "200":
          description: The checks and what would change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemotePreflight"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/demote:
    post:
      operationId: demoteProject
      summary: Demote a dedicated project to the shared tier
      description: |
        Queues a `demote` operation (V2 §5.3): the database and every
        login are created on a shared cluster with the same SCRAM
        verifiers, writes freeze while the data is copied and verified,
        then the pooler route moves. Connection strings and passwords do
        not change. If anything fails before the route moves, the
        project stays on its dedicated instance untouched. The
        dedicated instance is stopped and kept for 48 hours, then
        destroyed, which releases its share of the dedicated allowance.
        Point-in-time recovery ends at the demotion; the existing base
        backups stay restorable until their retention ends. Refused with
        `409` when a check fails, or when there are warnings and
        `accept_warnings` is not set.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoteRequest"
      responses:
        "202":
          description: Demotion queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/instance:
    post:
      operationId: projectInstanceAction
      summary: Start, stop, or restart a dedicated project's instance
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceActionRequest"
      responses:
        "200":
          description: The instance after the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceState"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateProjectInstance
      summary: Change a dedicated project's instance (size, disk, recovery window)
      description: |
        The point-in-time recovery window (V4.1 §4.1): 7 days, or 14 or 30
        as billed add-ons on Pro and Team. A longer window grows day by day
        from now; a shorter one drops the older base backups at the next one.

        A new size or disk (V4.1 §5) queues a `resize_instance` operation:
        the instance restarts in a few seconds with the poolers holding
        clients, or with HA a standby is resized and switched to. When its
        node can't hold the new size, a `logical_move` to one that can is
        queued instead (`plan.move_to`). The dedicated allowance applies.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceUpdate"
      responses:
        "200":
          description: The instance, with the queued resize or move if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceUpdated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: Dedicated instance sizes
      tags: [projects]
      responses:
        "200":
          description: Profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}:
    get:
      operationId: getNode
      summary: A node, its agent's health, and what runs on it
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDetail"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateNode
      summary: Change a node's role (where new projects may go) or failure domain
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeRequest"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeNode
      summary: Take a node out of service (requires re-authentication)
      description: Refused (409) while instances run on it. Its agent's certificate stops being trusted.
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/shared-cluster:
    post:
      operationId: createSharedCluster
      summary: Run a shared cluster on this node (multi-node shared placement)
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedClusterRequest"
      responses:
        "202":
          description: Creation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/nodes/{id}/registration-token:
    post:
      operationId: createNodeRegistrationToken
      summary: Issue a one-time agent registration token (24 hours)
      tags: [nodes]
      parameters:
        - $ref: "#/components/parameters/NodeID"
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agent/register:
    post:
      operationId: registerAgent
      summary: Agent registration (called by xenibase-agent, not the UI)
      description: |
        Exchanges a one-time registration token and a CSR for a client
        certificate signed by the Xenibase agent CA. Needs no session; the
        token authenticates. Rate limited per address.
      tags: [nodes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegisterRequest"
      responses:
        "200":
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/sql:
    post:
      operationId: runSQL
      summary: Run SQL in the project database (SQL console)
      description: |
        Runs as the project's role (spec §8.5), with a statement timeout
        (30s by default), at most 1,000 rows per result. When the project's
        console is read-only, or `read_only` is set, one statement runs
        inside `BEGIN READ ONLY … ROLLBACK`. Otherwise several statements
        may run in one submission. SQL errors are returned in the result's
        `error` with status 200. Only an audit entry is stored, never the
        query text.
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlRequest"
      responses:
        "200":
          description: What the statements returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SqlResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/sql/cancel:
    post:
      operationId: cancelSQL
      summary: Cancel a running console query
      tags: [console]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SqlCancelRequest"
      responses:
        "200":
          description: Whether a running query was found and cancelled.
          content:
            application/json:
              schema:
