        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Only these projects (with node_ids, either covers).
        node_ids:
          type: array
          items:
            type: string
            format: uuid
