      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: Password changed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/terms:
    get:
      operationId: getTerms
      summary: The current terms of use and privacy notice (public)
      tags: [auth]
      responses:
        "200":
          description: Current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Terms"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/preview:
    post:
      operationId: previewInvitation
      summary: What an invitation link offers (public, token-gated)
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation link (public, token-gated)
      description: |
        Signed in, accepts for the current account (which must have the
        invited address). Otherwise creates the account from `name`,
        `password`, and `terms_version`, and returns a login challenge that
        enrols the authenticator.
      tags: [orgs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: Change your password; ends your other sessions
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/tokens:
    get:
      operationId: listMyTokens
      summary: Your API tokens (only the calling token's organisation, with a token)
      tags: [tokens]
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createToken
      summary: Create an API token, shown once
      description: |
        A token acts in one organisation, with additive scopes (read, write,
        admin; admin requires write), optionally restricted to some
        projects, until it expires (default 90 days, at most the platform
        maximum). Created with a token, the new one can't exceed the
        caller's scopes, projects, or expiry.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/tokens/{token_id}:
    delete:
      operationId: revokeMyToken
      summary: Revoke one of your tokens
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/TokenID"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/storage-targets:
    get:
      operationId: listOrgStorageTargets
      summary: The organisation's own backup storage targets (owners and admins)
      description: Org targets are buckets the organisation brings; backups there don't count against its backup quota (V2 §6).
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrgStorageTarget
      summary: Add an org target after a live test
      description: Runs the write/read/list/delete test under the prefix and saves only if it passes (`saved`). Credentials are sealed with the master key and never shown again.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: The test failed; nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/storage-targets/{target_id}:
    get:
      operationId: getOrgStorageTarget
      summary: One org target (never its credentials)
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TargetID"
      responses:
        "200":
          description: Target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTarget"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateOrgStorageTarget
      summary: Change an org target after a live test
      description: Empty `access_key` or `secret_key` keep the stored ones.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TargetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: Test result; `saved` says whether the target changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOrgStorageTarget
      summary: Delete an org target
      description: |
        Refused (409 `target_in_use`) while a project uses it, and while it
        holds unexpired backups unless `accept_unrestorable=true`: those
        backups then become unrestorable. The bucket is not touched.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TargetID"
        - $ref: "#/components/parameters/AcceptUnrestorable"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/storage-targets/test:
    post:
      operationId: testStorageTarget
      summary: Run the live write/read/list/delete test without saving
      description: |
        With `target_id`, empty credentials are taken from that stored
        target (one of the organisation's, or a platform target for the
        platform admin).
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/OrgQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetTestRequest"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTestResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/oauth/clients:
    get:
      operationId: listOAuthClients
      summary: The third-party apps registered on this server
      tags: [admin]
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createOAuthClient
      summary: Register a third-party app (OAuth client)
      description: |
        Redirect URIs must be absolute `https://` URLs without a fragment
        (`http://localhost` and `http://127.0.0.1` are allowed for
        development); the authorize request must match one exactly. A
        confidential client (the default) gets a secret, shown once.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOAuthClientRequest"
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientCreated"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/oauth/clients/{client_id}:
    delete:
      operationId: disableOAuthClient
      summary: Disable a third-party app
      description: The app can no longer ask for consent or exchange codes, and every token it was issued is revoked.
      tags: [admin]
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Disabled.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/storage-targets:
    get:
      operationId: listPlatformStorageTargets
      summary: Platform storage targets (platform admin)
      description: Storage on platform targets counts against each organisation's backup quota. Org targets are not listed.
      tags: [admin]
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPlatformStorageTarget
      summary: Add a platform target after a live test (platform admin)
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: The test failed; nothing was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/admin/storage-targets/{target_id}:
    get:
      operationId: getPlatformStorageTarget
      summary: One platform target (platform admin)
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TargetID"
      responses:
        "200":
          description: Target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTarget"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePlatformStorageTarget
      summary: Change a platform target after a live test (platform admin)
      description: "`is_default: true` makes it the platform default (exactly one is)."
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TargetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageTargetRequest"
      responses:
        "200":
          description: Test result; `saved` says whether the target changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTargetSaveResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePlatformStorageTarget
      summary: Delete a platform target (platform admin)
      description: The default can't be deleted; otherwise as for org targets.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TargetID"
        - $ref: "#/components/parameters/AcceptUnrestorable"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/storage-target:
    get:
      operationId: getProjectStorageTarget
      summary: Where the project's backups go, its key, and the targets it can use
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBackupStorage"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: setProjectStorageTarget
      summary: Send the project's new backups to another target
      description: |
        `target_id` null is the platform default. Existing backups keep
        their target and stay restorable. `copy_existing` copies them to the
        new target as an operation, verified by checksum; `delete_originals`
        then deletes the originals. A dedicated project's WAL-G is
        reconfigured and a fresh base backup taken at once.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStorageTargetRequest"
      responses:
        "200":
          description: Switched; `operation` is set when work was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStorageTargetResult"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/backup-key:
    post:
      operationId: enableProjectBackupKey
      summary: Give the project its own backup key
      description: |
        Generates the key (idempotent unless `rotate`); new backups use it,
        existing backups keep theirs. Download it with
        `GET /projects/{id}/backup-key/download`.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectBackupKeyRequest"
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBackupKey"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/backup-key/download:
    get:
      operationId: downloadProjectBackupKey
      summary: Download the project's backup key with a README (re-authentication)
      description: |
        The OpenPGP private key, armored, after a README on decrypting and
        restoring with standard tools (gpg, pg_restore). Needs a recent
        re-authentication (403 `reauth_required`); every download is audited.
      tags: [storage]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The key file.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/tokens:
    get:
      operationId: listOrgTokens
      summary: Every token scoped to the organisation (owners and admins)
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/OrgID"
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/orgs/{org}/tokens/{token_id}:
    delete:
      operationId: revokeOrgToken
      summary: Revoke any token scoped to the organisation (owners and admins)
      tags: [tokens]
      parameters:
        - $ref: "#/components/parameters/OrgID"
        - $ref: "#/components/parameters/TokenID"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device:
    post:
      operationId: startDeviceLogin
      summary: Start a CLI device login
      description: |
        The CLI shows `user_code` and opens `verification_uri_complete`; a
        signed-in user approves it, choosing the organisation and scopes,
        and the CLI polls `/api/v1/auth/device/token` for the token.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStartRequest"
      responses:
        "200":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device/token:
    post:
      operationId: pollDeviceLogin
      summary: Collect a device login's token
      description: |
        Answers 400 with code `authorization_pending` until approved
        (`slow_down` when polled too often), then the token exactly once;
        `access_denied` or `expired_token` end the login.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollRequest"
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device/requests/{user_code}:
    get:
      operationId: getDeviceLogin
      summary: A pending device login, for the approval page
      tags: [tokens]
      parameters:
        - name: user_code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/device/approve:
    post:
      operationId: approveDeviceLogin
      summary: Approve (or deny) a device login
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveRequest"
      responses:
        "200":
          description: Approved; the CLI collects the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIToken"
        "204":
          description: Denied.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/oauth/authorize:
    get:
      operationId: getOAuthAuthorization
      summary: What a third-party app asks for, for the consent page
      description: |
        The first step of an app's OAuth 2.0 authorization code flow (RFC
        6749 s4.1, PKCE required, RFC 7636). The consent page at
        `/oauth/authorize` calls this with the app's query, and shows the
        app's name, the scopes it asks for, and the organisations the user
        may grant for, each with its projects. A bad `client_id` or
        `redirect_uri` is a 400 and nothing is redirected (s4.1.2.1).
      tags: [oauth]
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: Space-separated `read`, `write`, `admin`; the app's allowed scopes by default.
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          description: Only `S256` is accepted.
          schema:
            type: string
      responses:
        "200":
          description: The request, for the consent page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAuthorizeInfo"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: decideOAuthAuthorization
      summary: Approve or deny an app's request
      description: |
        Approving stores a single-use authorization code (10 minutes) for
        the chosen organisation, scopes (narrowed from the request, never
        widened), projects and expiry, and answers with the app's redirect
        URI carrying `code` and `state`. Denying answers with the redirect
        carrying `error=access_denied`. The browser then goes there.
      tags: [oauth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthDecision"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRedirect"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/oauth/token:
    post:
      operationId: exchangeOAuthToken
      summary: Exchange an authorization code for an API token
      description: |
        RFC 6749 s4.1.3 with PKCE (s7636 s4.5): `grant_type=authorization_code`,
        the `code`, the same `redirect_uri`, the `client_id`, the
        `client_secret` (confidential clients; also accepted as HTTP Basic
        auth) and the `code_verifier`. Form-encoded or JSON. A code works
        once: a second exchange fails with `invalid_grant` and revokes the
        token the first one issued (s4.1.2). The answer is an ordinary
        Xenibase API token (`xb_…`) for the user in the organisation they
        chose, with the granted scopes, projects and expiry. Errors are in
        OAuth's shape (s5.2): `invalid_request`, `invalid_client` (401),
        `invalid_grant`, `unsupported_grant_type`; `slow_down` (429) when
        an address tries too often.
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        default:
          $ref: "#/components/responses/OAuthError"
  /api/v1/oauth/revoke:
    post:
      operationId: revokeOAuthToken
      summary: An app revokes a token it was issued
      description: |
        RFC 7009: the client authenticates (`client_id` and `client_secret`
        in the body or as HTTP Basic auth) and names the token. Answers 200
        whether or not the token was still valid, or was ever this app's.
        Revoking elsewhere (Account, the organisation's tokens) has the
        same effect: the token answers `401 invalid_token` from then on.
      tags: [oauth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
      responses:
        "200":
          description: Revoked, or nothing to revoke.
        default:
          $ref: "#/components/responses/OAuthError"
  /api/v1/admin/settings/tokens:
    get:
      operationId: getTokenSettings
      summary: Platform-wide token rules
      tags: [admin]
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSettings"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putTokenSettings
      summary: Change the platform-wide token rules
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenSettings"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenSettings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      summary: Your active sessions
      tags: [account]
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      summary: End one of your sessions
      tags: [account]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Ended.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/me/recovery-codes:
    get:
      operationId: getRecoveryCodes
      summary: How many recovery codes you have left
      tags: [account]
      responses:
        "200":
          description: Count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace your recovery codes (step-up auth); shown once
      tags: [account]
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
