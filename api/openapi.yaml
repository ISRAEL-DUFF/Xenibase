          $ref: "#/components/responses/Error"
  /api/v1/projects/{id}/switch-credentials:
    post:
      operationId: switchProjectCredentials
      summary: Switch a V1 project to opaque credentials (V2 §10.2)
      description: |
        Creates an opaque owner role with a new password, returned once. The
        V1 role and database name keep working until the grace period ends,
        then stop.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchCredentialsRequest"
      responses:
        "202":
          description: Switch operation queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchedCredentials"
