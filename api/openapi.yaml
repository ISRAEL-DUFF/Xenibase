          type: string
          enum: [creating, streaming, lagging, down, deleting, detaching, failed]
        in_rotation:
          type: boolean
          description: The read-only route sends reads to it.
        lag_bytes:
          type: integer
          format: int64
        lag_ms:
          type: integer
          format: int64
          description: How long ago the primary wrote what it has not replayed yet.
