# Xenibase on a single host (spec §11.1): Caddy, xenibase-server, the metadata
# database, the shared PostgreSQL 18 cluster, the two PgBouncer poolers, and
# the node agent (backups, restores, imports, and dedicated instances).
#
#   ./install.sh            writes .env with generated secrets, then starts it
#   docker compose up -d    (with an existing .env)
#
# Then open https://$XENIBASE_UI_DOMAIN and enter the setup code from
# `docker compose logs xenibase-server`.

name: xenibase

# Every container's log: Docker's json-file driver, rotated, so a chatty or
# crash-looping service can't fill the disk (at most 5 x 50 MB per container).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-pooler: &pooler
  image: edoburu/pgbouncer:v1.25.1-p0
  restart: unless-stopped
  logging: *logging
  depends_on:
    xenibase-server:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 $$(grep -E '^listen_port' /etc/pgbouncer/pgbouncer.ini | tr -dc 0-9)"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  caddy:
    # The stock image, unless backend services are on: enable-services.sh builds
    # one with the Cloudflare DNS plugin for the wildcard certificate.
    image: ${CADDY_IMAGE:-caddy:2.10.0}
    restart: unless-stopped
    logging: *logging
    ports:
      - "${XENIBASE_HTTP_PORT:-80}:80"
      - "${XENIBASE_HTTPS_PORT:-443}:443"
    environment:
      XENIBASE_UI_DOMAIN: ${XENIBASE_UI_DOMAIN:?set XENIBASE_UI_DOMAIN in .env}
      XENIBASE_ACME_EMAIL: ${XENIBASE_ACME_EMAIL:?set XENIBASE_ACME_EMAIL in .env}
      CADDY_UI_TLS: ${CADDY_UI_TLS:-}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      # Backend services (./enable-services.sh), read by caddy.d/api.caddy.
      XENIBASE_API_DOMAIN: ${XENIBASE_API_DOMAIN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      DESEC_TOKEN: ${DESEC_TOKEN:-}
      # acme-dns: only the password is read from the environment by the plugin;
      # the username, subdomain and server URL are written into caddy.d/api.caddy.
      ACMEDNS_PASSWORD: ${ACMEDNS_PASSWORD:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.31.250.10

  xenibase-server:
    image: ${XENIBASE_IMAGE:-xenibase:local}
    build:
      context: ../..
    restart: unless-stopped
    logging: *logging
    depends_on:
      metadata-db:
        condition: service_healthy
      shared-pg:
        condition: service_healthy
    environment:
      XENIBASE_DATABASE_URL: postgres://xenibase:${METADATA_DB_PASSWORD:?}@metadata-db:5432/xenibase?sslmode=disable
      XENIBASE_MASTER_KEY: ${XENIBASE_MASTER_KEY:?run install.sh or set XENIBASE_MASTER_KEY}
      XENIBASE_LOG_FORMAT: ${XENIBASE_LOG_FORMAT:-json}
      # Caddy terminates TLS; trust its X-Forwarded-For.
      XENIBASE_TRUSTED_PROXIES: 172.31.250.10
      # Links in account, invitation, and alert email.
      XENIBASE_PUBLIC_URL: ${XENIBASE_PUBLIC_URL:-https://${XENIBASE_UI_DOMAIN}}
      XENIBASE_PUBLIC_IPS: ${XENIBASE_PUBLIC_IPS:-}
      XENIBASE_SETUP_CODE: ${XENIBASE_SETUP_CODE:-}
      XENIBASE_SHARED_ADMIN_URL: postgres://xenibase_admin:${SHARED_ADMIN_PASSWORD:?}@shared-pg:5432/postgres?sslmode=disable
      XENIBASE_SHARED_POOLER_HOST: shared-pg
      XENIBASE_POOLER_ADMIN_PASSWORD: ${POOLER_ADMIN_PASSWORD:?}
      XENIBASE_POOLER_SESSION_ADDR: pooler-session:5432
      XENIBASE_POOLER_POOLED_ADDR: pooler-tx:6543
      XENIBASE_POOLER_SSLMODE: require
      XENIBASE_POOLER_TLS: ${XENIBASE_POOLER_TLS:-acme}
      XENIBASE_ACME_EMAIL: ${XENIBASE_ACME_EMAIL:?}
      XENIBASE_ACME_CA: ${XENIBASE_ACME_CA:-}
      XENIBASE_ACME_CA_ROOTS: ${XENIBASE_ACME_CA_ROOTS:-}
      # The wizard sets the DB hostname; this is only the starting value.
      XENIBASE_DB_HOST: ${XENIBASE_DB_HOST:-${XENIBASE_UI_DOMAIN}}
      XENIBASE_DB_SESSION_PORT: ${XENIBASE_DB_SESSION_PORT:-5432}
      XENIBASE_DB_POOLED_PORT: ${XENIBASE_DB_POOLED_PORT:-6543}
      XENIBASE_DB_SSLMODE: require
      # Lets the bundled agent register the local node by itself.
      XENIBASE_AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:?run install.sh or set AGENT_BOOTSTRAP_TOKEN}
      XENIBASE_BACKUP_HOUR: ${XENIBASE_BACKUP_HOUR:-2}
      XENIBASE_METRICS_INTERVAL: ${XENIBASE_METRICS_INTERVAL:-1m}
      XENIBASE_TENANCY_SWEEP_INTERVAL: ${XENIBASE_TENANCY_SWEEP_INTERVAL:-5m}
      # Webhook delivery's direct LISTEN connections, outside the poolers:
      # at most this many per instance (the shared cluster below has
      # max_connections=500), released after the outbox has had nothing to
      # send for IDLE_AFTER; other projects are polled every IDLE_POLL.
      XENIBASE_WEBHOOK_LISTEN_MAX: ${XENIBASE_WEBHOOK_LISTEN_MAX:-50}
      XENIBASE_WEBHOOK_IDLE_AFTER: ${XENIBASE_WEBHOOK_IDLE_AFTER:-10m}
      XENIBASE_WEBHOOK_IDLE_POLL: ${XENIBASE_WEBHOOK_IDLE_POLL:-30s}
      # Query insights (V3 §8): which plans get them, how often
      # pg_stat_statements is read, and the slow-query threshold.
      XENIBASE_INSIGHTS_PLANS: ${XENIBASE_INSIGHTS_PLANS:-pro,team}
      XENIBASE_INSIGHTS_INTERVAL: ${XENIBASE_INSIGHTS_INTERVAL:-5m}
      XENIBASE_SLOW_QUERY_MS: ${XENIBASE_SLOW_QUERY_MS:-1000}
      XENIBASE_METRICS_TOKEN: ${XENIBASE_METRICS_TOKEN:-}
      XENIBASE_CONSOLE_DISABLED: ${XENIBASE_CONSOLE_DISABLED:-false}
      # The waker answers paused Free projects' connections (V3 §4.2); the
      # poolers reach it at this address. Pooler hosts elsewhere need the
      # server's private address instead (docs/free-tier.md).
      XENIBASE_WAKER_ADDR: ${XENIBASE_WAKER_ADDR:-172.31.250.11:6435}
      XENIBASE_WAKER_LISTEN: ${XENIBASE_WAKER_LISTEN:-:6435}
      # Open signup's protection (V3 §7.4).
      XENIBASE_TURNSTILE_SITE_KEY: ${XENIBASE_TURNSTILE_SITE_KEY:-}
      XENIBASE_TURNSTILE_SECRET: ${XENIBASE_TURNSTILE_SECRET:-}
      XENIBASE_SIGNUPS_PER_IP: ${XENIBASE_SIGNUPS_PER_IP:-3}
      # Organisation invitations a day, per organisation and per inviter.
      XENIBASE_INVITES_PER_ORG_DAY: ${XENIBASE_INVITES_PER_ORG_DAY:-100}
      XENIBASE_INVITES_PER_USER_DAY: ${XENIBASE_INVITES_PER_USER_DAY:-50}
      # Support (V3 §7.1, docs/support.md): the inbox, the email
      # provider's inbound webhook secret, and WhatsApp's Cloud API.
      XENIBASE_SUPPORT_EMAIL: ${XENIBASE_SUPPORT_EMAIL:-}
      XENIBASE_SUPPORT_INBOUND_SECRET: ${XENIBASE_SUPPORT_INBOUND_SECRET:-}
      XENIBASE_SUPPORT_AUTHSERV_ID: ${XENIBASE_SUPPORT_AUTHSERV_ID:-}
      XENIBASE_WHATSAPP_PHONE_NUMBER_ID: ${XENIBASE_WHATSAPP_PHONE_NUMBER_ID:-}
      XENIBASE_WHATSAPP_ACCESS_TOKEN: ${XENIBASE_WHATSAPP_ACCESS_TOKEN:-}
      XENIBASE_WHATSAPP_APP_SECRET: ${XENIBASE_WHATSAPP_APP_SECRET:-}
      XENIBASE_WHATSAPP_VERIFY_TOKEN: ${XENIBASE_WHATSAPP_VERIFY_TOKEN:-}
      # Project auth codes (V4 §4.6, docs/backend-services.md): Termii for
      # SMS, and the WhatsApp number above with an authentication template.
      XENIBASE_TERMII_API_KEY: ${XENIBASE_TERMII_API_KEY:-}
      XENIBASE_TERMII_SENDER_ID: ${XENIBASE_TERMII_SENDER_ID:-}
      XENIBASE_TERMII_URL: ${XENIBASE_TERMII_URL:-}
      # Africa's Talking: the SMS fallback when Termii fails.
      XENIBASE_AFRICASTALKING_USERNAME: ${XENIBASE_AFRICASTALKING_USERNAME:-}
      XENIBASE_AFRICASTALKING_API_KEY: ${XENIBASE_AFRICASTALKING_API_KEY:-}
      XENIBASE_AFRICASTALKING_FROM: ${XENIBASE_AFRICASTALKING_FROM:-}
      XENIBASE_AFRICASTALKING_URL: ${XENIBASE_AFRICASTALKING_URL:-}
      XENIBASE_WHATSAPP_OTP_TEMPLATE: ${XENIBASE_WHATSAPP_OTP_TEMPLATE:-}
      XENIBASE_WHATSAPP_OTP_LANGUAGE: ${XENIBASE_WHATSAPP_OTP_LANGUAGE:-}
      XENIBASE_SMS_PRICE_MINOR: ${XENIBASE_SMS_PRICE_MINOR:-}
      XENIBASE_WHATSAPP_PRICE_MINOR: ${XENIBASE_WHATSAPP_PRICE_MINOR:-}
      XENIBASE_MESSAGE_CURRENCY: ${XENIBASE_MESSAGE_CURRENCY:-}
      XENIBASE_PHONE_AUTH_FREE: ${XENIBASE_PHONE_AUTH_FREE:-}
      # Capacity automation (V3 §5, docs/capacity.md): the provider new
      # servers come from, and what their cloud-init runs.
      XENIBASE_REGION: ${XENIBASE_REGION:-eu-central}
      XENIBASE_CLOUD_PROVIDER: ${XENIBASE_CLOUD_PROVIDER:-manual}
      XENIBASE_HETZNER_TOKEN: ${XENIBASE_HETZNER_TOKEN:-}
      XENIBASE_HETZNER_LOCATION: ${XENIBASE_HETZNER_LOCATION:-fsn1}
      XENIBASE_HETZNER_NETWORK_ID: ${XENIBASE_HETZNER_NETWORK_ID:-}
      XENIBASE_HETZNER_PLACEMENT_GROUP_ID: ${XENIBASE_HETZNER_PLACEMENT_GROUP_ID:-}
      XENIBASE_HETZNER_SSH_KEYS: ${XENIBASE_HETZNER_SSH_KEYS:-}
      XENIBASE_CLOUD_AGENT_IMAGE: ${XENIBASE_CLOUD_AGENT_IMAGE:-}
      XENIBASE_CLOUD_PG_IMAGE: ${XENIBASE_CLOUD_PG_IMAGE:-}
      XENIBASE_CLOUD_SERVER_URL: ${XENIBASE_CLOUD_SERVER_URL:-}
      XENIBASE_CLOUD_PRIVATE_CIDR: ${XENIBASE_CLOUD_PRIVATE_CIDR:-10.0.0.0/16}
      # Backend services (V4, docs/backend-services.md#running-xenibase-edge):
      # projects' API domain, the secret every xenibase-edge shares (32+
      # characters), and the edge image for edge nodes Xenibase adds.
      XENIBASE_API_DOMAIN: ${XENIBASE_API_DOMAIN:-}
      XENIBASE_EDGE_SECRET: ${XENIBASE_EDGE_SECRET:-}
      XENIBASE_EDGE_SECRET_ALL_REGIONS: ${XENIBASE_EDGE_SECRET_ALL_REGIONS:-}
      XENIBASE_CLOUD_EDGE_IMAGE: ${XENIBASE_CLOUD_EDGE_IMAGE:-}
      # Optional settings the docs describe; empty means the default.
      # Payments (docs/payments.md).
      XENIBASE_ISWALLET_BASE_URL: ${XENIBASE_ISWALLET_BASE_URL:-}
      XENIBASE_ISWALLET_API_KEY: ${XENIBASE_ISWALLET_API_KEY:-}
      XENIBASE_ISWALLET_WEBHOOK_SECRET: ${XENIBASE_ISWALLET_WEBHOOK_SECRET:-}
      XENIBASE_ISWALLET_OWNER_PREFIX: ${XENIBASE_ISWALLET_OWNER_PREFIX:-}
      XENIBASE_ISWALLET_CLIENT_ID: ${XENIBASE_ISWALLET_CLIENT_ID:-}
      # The Free tier's clocks (docs/free-tier.md), e.g. 720h.
      XENIBASE_FREE_PAUSE_AFTER: ${XENIBASE_FREE_PAUSE_AFTER:-}
      XENIBASE_FREE_ARCHIVE_AFTER: ${XENIBASE_FREE_ARCHIVE_AFTER:-}
      XENIBASE_FREE_DELETE_AFTER: ${XENIBASE_FREE_DELETE_AFTER:-}
      # HA minor upgrades wait for an announced window unless false
      # (docs/ha.md).
      XENIBASE_MAINTENANCE_REQUIRE_ANNOUNCEMENT: ${XENIBASE_MAINTENANCE_REQUIRE_ANNOUNCEMENT:-}
      XENIBASE_PG_VERSIONS: ${XENIBASE_PG_VERSIONS:-}
      # The status page (docs/status-page.md).
      XENIBASE_STATUS_URL: ${XENIBASE_STATUS_URL:-}
      XENIBASE_STATUS_PUSH_SECRET: ${XENIBASE_STATUS_PUSH_SECRET:-}
      XENIBASE_STATUS_REGION: ${XENIBASE_STATUS_REGION:-}
      XENIBASE_STATUS_COMPONENTS: ${XENIBASE_STATUS_COMPONENTS:-}
      # Purge a Cloudflare CDN of files that leave public buckets (docs/backend-services.md).
      XENIBASE_CDN_CLOUDFLARE_ZONE_ID: ${XENIBASE_CDN_CLOUDFLARE_ZONE_ID:-}
      XENIBASE_CDN_CLOUDFLARE_TOKEN: ${XENIBASE_CDN_CLOUDFLARE_TOKEN:-}
      # Rotating the master key (docs/operations.md).
      XENIBASE_MASTER_KEY_PREVIOUS: ${XENIBASE_MASTER_KEY_PREVIOUS:-}
      XENIBASE_FLOATING_IP_ID: ${XENIBASE_FLOATING_IP_ID:-}
      XENIBASE_OUTBOUND_BLOCK: ${XENIBASE_OUTBOUND_BLOCK:-}
    volumes:
      - xenibase-data:/var/lib/xenibase
      - pooler-config:/var/lib/xenibase/pooler
    healthcheck:
      test: ["CMD", "/usr/local/bin/xenibase-server", "-healthcheck", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 30
    # Fixed addresses: the shared cluster's pg_hba.conf names them.
    networks:
      default:
        ipv4_address: 172.31.250.11

  # The local node's agent: it runs pg_dump/pg_restore next to the shared
  # cluster and registers with the bootstrap token on first start (mTLS
  # from then on; the CA is pinned in agent-state).
  # Backend services' gateway (docs/backend-services.md#running-xenibase-edge).
  # Off until ./enable-services.sh turns on the "services" profile. Caddy
  # terminates TLS for *.$XENIBASE_API_DOMAIN and proxies here over plain HTTP.
  xenibase-edge:
    profiles: ["services"]
    image: ${XENIBASE_EDGE_IMAGE:-xenibase-edge:local}
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      xenibase-server:
        condition: service_healthy
    mem_limit: ${XENIBASE_EDGE_MEMORY:-1g}
    environment:
      XENIBASE_EDGE_CONTROL_URL: http://xenibase-server:8080
      XENIBASE_EDGE_SECRET: ${XENIBASE_EDGE_SECRET:-}
      XENIBASE_EDGE_DOMAIN: ${XENIBASE_API_DOMAIN:-}
      XENIBASE_EDGE_REGION: ${XENIBASE_REGION:-eu-central}
      XENIBASE_EDGE_LISTEN: ":8443"
      XENIBASE_EDGE_POOLER_ADDR: pooler-tx:6543
      XENIBASE_EDGE_SESSION_ADDR: pooler-session:5432
      XENIBASE_EDGE_LOG_FORMAT: ${XENIBASE_LOG_FORMAT:-json}
      # Caddy is the only thing in front of it.
      # A network range: the edge refuses a bare address and exits.
      XENIBASE_EDGE_TRUSTED_PROXIES: 172.31.250.10/32
      XENIBASE_EDGE_CACHE_MB: ${XENIBASE_EDGE_CACHE_MB:-64}
      XENIBASE_EDGE_RENDER_MEMORY_MB: ${XENIBASE_EDGE_RENDER_MEMORY_MB:-512}

  xenibase-agent:
    image: ${XENIBASE_AGENT_IMAGE:-xenibase-agent:local}
    build:
      context: ../..
      target: agent
    restart: unless-stopped
    logging: *logging
    depends_on:
      xenibase-server:
        condition: service_healthy
    # Root, for the Docker socket: dedicated instances are sibling
    # containers on this network (spec §4.2).
    user: "0:0"
    environment:
      XENIBASE_AGENT_SERVER: http://xenibase-server:8080
      XENIBASE_AGENT_BOOTSTRAP_TOKEN: ${AGENT_BOOTSTRAP_TOKEN:?}
      XENIBASE_AGENT_NODE: local
      XENIBASE_AGENT_ADVERTISE: xenibase-agent:7070
      XENIBASE_AGENT_LOG_FORMAT: ${XENIBASE_LOG_FORMAT:-json}
      XENIBASE_AGENT_NETWORK: ${XENIBASE_NETWORK:-xenibase}
      XENIBASE_AGENT_PG_IMAGE: ${XENIBASE_PG_IMAGE:-xenibase-postgres:{major}-walg3.0.9}
      # Instances accept logins from xenibase-server, the poolers, and this
      # agent only (spec §7.1). Add a remote control node's address here.
      XENIBASE_AGENT_DB_ALLOW: ${XENIBASE_AGENT_DB_ALLOW:-172.31.250.11/32,172.31.250.12/32,172.31.250.13/32,172.31.250.14/32}
      # Moves (V3 §2.3): instances on this network replicate from each other
      # and from the shared cluster, as each move's own login only.
      XENIBASE_AGENT_MOVE_ALLOW: ${XENIBASE_AGENT_MOVE_ALLOW:-172.31.250.0/24}
    volumes:
      - agent-state:/var/lib/xenibase-agent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        ipv4_address: 172.31.250.14

  metadata-db:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: xenibase
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?}
      POSTGRES_DB: xenibase
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - metadata-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenibase -d xenibase"]
      interval: 2s
      timeout: 3s
      retries: 30

  shared-pg:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: xenibase_admin
      POSTGRES_PASSWORD: ${SHARED_ADMIN_PASSWORD:?}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    # §11.2 tuning for an 8 GB host; adjust for yours.
    command:
      - postgres
      - -c
      - max_connections=500
      - -c
      - shared_buffers=${SHARED_PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${SHARED_PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - autovacuum_max_workers=5
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=5s
      - -c
      - log_statement=none
      - -c
      - hba_file=/etc/xenibase/pg_hba.conf
      # Moves by logical replication (V3 §2.3); changing it restarts the
      # cluster once.
      - -c
      - wal_level=logical
    volumes:
      - shared-data:/var/lib/postgresql
      - ./shared-pg-hba.conf:/etc/xenibase/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xenibase_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  pooler-session:
    <<: *pooler
    ports:
      - "${XENIBASE_DB_SESSION_PORT:-5432}:5432"
    volumes:
      - ../pgbouncer/session.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pooler-config:/etc/pgbouncer/xenibase:ro
    networks:
      default:
        ipv4_address: 172.31.250.12

  pooler-tx:
    <<: *pooler
    ports:
      - "${XENIBASE_DB_POOLED_PORT:-6543}:6543"
    volumes:
      - ../pgbouncer/transaction.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pooler-config:/etc/pgbouncer/xenibase:ro
    networks:
      default:
        ipv4_address: 172.31.250.13

networks:
  default:
    # Named, so the agent can attach dedicated instances to it.
    name: ${XENIBASE_NETWORK:-xenibase}
    ipam:
      config:
        - subnet: 172.31.250.0/24
          # Dynamic addresses stay clear of the fixed ones (.10 to .20).
          ip_range: 172.31.250.128/25

volumes:
  caddy-data:
  caddy-config:
  xenibase-data:
  pooler-config:
  metadata-data:
  shared-data:
  agent-state:
