; PgBouncer, transaction mode. Shared by the dev environment and the install
; bundle.
;
; xenibase-server owns the routes, the auth file, and the TLS certificate
; (spec §5.2). It writes them into XENIBASE_POOLER_CONFIG_DIR, mounted here at
; /etc/pgbouncer/xenibase, and RELOADs. In dev, `make dev-up` seeds that
; directory so the poolers can start before the server has run.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
unix_socket_dir =

pool_mode = transaction
; Who may log in from where: SCRAM for everyone, except that a project
; with an IP allowlist takes its customer logins only from those networks.
; Generated by xenibase-server, re-read on RELOAD.
auth_type = hba
auth_hba_file = /etc/pgbouncer/xenibase/hba.conf
auth_file = /etc/pgbouncer/xenibase/userlist.txt
admin_users = xenibase
stats_users = xenibase

max_client_conn = 2000
; Close idle server connections after 30s (default 10 min): with hundreds
; of projects, idle backends would otherwise crowd the shared cluster's
; max_connections (load test, docs/load-test.md).
server_idle_timeout = 30
; A login that failed (a locked or suspended project, V2 §10.4/§10.8) is
; retried quickly once the lock lifts.
server_login_retry = 2
default_pool_size = 5
server_tls_sslmode = prefer

; Clients must use TLS (spec §3.3). xenibase-server keeps the certificate in
; the generated directory current and RELOADs on change.
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/xenibase/server.crt
client_tls_key_file = /etc/pgbouncer/xenibase/server.key
client_tls_protocols = tlsv1.2,tlsv1.3
ignore_startup_parameters = extra_float_digits,options
; Lets ORMs that use prepared statements work in transaction mode.
max_prepared_statements = 200

; Generated routes. Keep this last: the file starts its own [databases] section.
%include /etc/pgbouncer/xenibase/databases.ini
