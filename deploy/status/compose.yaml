# xenibase-status on its own server (another provider than Xenibase's).
# Put status.toml and the secret files next to this file, then:
#
#   docker compose up -d
#
# Caddy terminates TLS for STATUS_DOMAIN (point its DNS here first).

name: xenibase-status

services:
  status:
    image: ${XENIBASE_STATUS_IMAGE:-xenibase-status:local}
    restart: unless-stopped
    volumes:
      - ./status.toml:/etc/xenibase-status/status.toml:ro
      - ./secrets:/run/secrets:ro
      - data:/var/lib/xenibase-status
    environment:
      XENIBASE_STATUS_LOG_FORMAT: json

  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: ["caddy", "reverse-proxy", "--from", "${STATUS_DOMAIN:?set STATUS_DOMAIN}", "--to", "status:8080"]
    volumes:
      - caddy:/data

volumes:
  data:
  caddy:
